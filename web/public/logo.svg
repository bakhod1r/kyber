<svg xmlns="http://www.w3.org/2000/svg" viewBox="287 133 680 680" width="128" height="128" role="img" aria-label="Kyber">
  <defs>
    <linearGradient id="kb-hex" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fe0ff"/>
      <stop offset="1" stop-color="#1f5fc4"/>
    </linearGradient>
    <linearGradient id="kb-hex-r" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#47c8ff"/>
      <stop offset="1" stop-color="#2a7fe0"/>
    </linearGradient>
    <linearGradient id="kb-hilt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d98a6"/>
      <stop offset=".5" stop-color="#e3e8ee"/>
      <stop offset="1" stop-color="#8d98a6"/>
    </linearGradient>
    <filter id="kb-glow" x="-200%" y="-20%" width="500%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <!-- crystal hexagon, split into a K -->
  <path d="M410 375 L557 288 L557 758 L410 670 Z" fill="url(#kb-hex)"/>
  <path d="M673 278 L836 375 L673 472 Z" fill="url(#kb-hex-r)"/>
