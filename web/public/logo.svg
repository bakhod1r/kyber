  <path d="M673 618 L780 710 L673 770 Z" fill="url(#kb-hex-r)"/>
  <!-- lightsaber: glow, blade, hilt -->
  <rect x="596" y="150" width="50" height="470" rx="25" fill="#3fd0ff" opacity=".85" filter="url(#kb-glow)"/>
  <rect x="607" y="157" width="28" height="456" rx="14" fill="#eafcff"/>
  <rect x="611" y="170" width="20" height="440" rx="10" fill="#ffffff"/>
  <g fill="url(#kb-hilt)">
    <rect x="594" y="625" width="53" height="9" rx="2"/>
    <rect x="594" y="641" width="53" height="9" rx="2"/>
    <rect x="598" y="658" width="45" height="86" rx="4"/>
    <path d="M598 752 H643 L636 770 V792 H605 V770 Z"/>
  </g>
  <rect x="611" y="674" width="19" height="54" rx="2" fill="none" stroke="#3b4553" stroke-width="5"/>
