<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Kyber">
  <defs>
    <radialGradient id="kb-halo" cx="50%" cy="54%" r="50%">
      <stop offset="0" stop-color="#4fd2ff" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#2f8fff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#2f8fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kb-left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9f7ff"/>
      <stop offset="1" stop-color="#5cc8ff"/>
    </linearGradient>
    <linearGradient id="kb-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fe3ff"/>
      <stop offset="1" stop-color="#1f8bff"/>
    </linearGradient>
    <linearGradient id="kb-right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3aa7ff"/>
      <stop offset="1" stop-color="#0a3fb8"/>
    </linearGradient>
    <linearGradient id="kb-core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="kb-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>
  <circle cx="64" cy="68" r="60" fill="url(#kb-halo)"/>
  <!-- crystal: pointed top, three visible faces, faceted base -->
  <path d="M64 6 L40 34 L44 98 L64 122 Z" fill="url(#kb-left)"/>
  <path d="M64 6 L56 36 L58 100 L64 122 L70 100 L72 36 Z" fill="url(#kb-mid)"/>
  <path d="M64 6 L88 34 L84 98 L64 122 Z" fill="url(#kb-right)"/>
  <path d="M64 6 L56 36 L58 100 L64 122 L44 98 L40 34 Z" fill="url(#kb-left)"/>
  <path d="M64 6 L72 36 L70 100 L64 122 L84 98 L88 34 Z" fill="url(#kb-right)"/>
  <!-- facet edges -->
  <path d="M40 34 L56 36 L72 36 L88 34 M44 98 L58 100 L70 100 L84 98" fill="none" stroke="#e8fbff" stroke-width="1.2" stroke-opacity=".7" stroke-linejoin="round"/>
  <!-- inner core -->
  <rect x="61" y="26" width="6" height="84" rx="3" fill="#bdf2ff" filter="url(#kb-blur)" opacity=".9"/>
  <rect x="62.6" y="30" width="2.8" height="76" rx="1.4" fill="url(#kb-core)"/>
  <!-- outline -->
  <path d="M64 6 L88 34 L84 98 L64 122 L44 98 L40 34 Z" fill="none" stroke="#c9f5ff" stroke-width="2" stroke-linejoin="round"/>
  <!-- glint -->
  <path d="M47 40 L51 40 L49 62 Z" fill="#ffffff" opacity=".75"/>
</svg>
