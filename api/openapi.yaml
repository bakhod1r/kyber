  /api/v1/search:
    get:
      operationId: searchIssues
      description: |
        JQL search over every project the caller may browse; issues hidden by security levels never match.
        Fields: project, key, type (issuetype), status, statusCategory, priority, assignee, reporter, sprint, fixVersion,
        resolution, parent, summary, description, text, "story points". Operators: = != IN, NOT IN, ~ !~, < <= > >=,
        IS [NOT] EMPTY; AND, OR, NOT, parentheses; functions currentUser(), openSprints(); ORDER BY field [ASC|DESC], ...
        An invalid query is 422 SEARCH_INVALID_JQL with the position in the detail ("JQL at 9: expected a value").
      parameters:
        - { name: jql, in: query, schema: { type: string, maxLength: 1000 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 200 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [total, items]
                properties:
                  total: { type: integer }
                  items: { type: array, items: { $ref: "#/components/schemas/SearchHit" } }
