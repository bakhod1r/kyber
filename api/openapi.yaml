openapi: 3.1.0
info:
  title: Kyber API
  version: 0.24.0
  description: |
    Self-hosted issue & project tracker. Authenticate with the `kyber_session` cookie (browsers)
    or `Authorization: Bearer <token>` (API clients). Cookie-authenticated writes must send
    `Content-Type: application/json` (CSRF guard). Non-members receive `404` for project resources.
  license: { name: MIT, identifier: MIT }
servers:
  - url: http://localhost:8080
security:
  - bearer: []
  - cookie: []

paths:
  /healthz:
    get:
      operationId: healthz
      security: []
      responses:
        "200": { $ref: "#/components/responses/Status" }
  /readyz:
    get:
      operationId: readyz
      security: []
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "503": { $ref: "#/components/responses/Status" }
  /metrics:
    get:
      operationId: metrics
      security: []
      responses:
        "200":
          description: Prometheus text exposition format.
          content:
            text/plain: { schema: { type: string } }

  /api/v1/auth/signup:
    post:
      operationId: signup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, password]
              properties:
                email: { type: string }
                name: { type: string }
                password: { type: string, minLength: 10, maxLength: 128 }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Logged in; also sets the `kyber_session` cookie.
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties: { token: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429":
          description: Too many failed attempts for this email and IP.
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds until the next attempt is allowed. }
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/auth/providers:
    get:
      operationId: authProviders
      security: []
      description: Which social sign-in methods this installation has configured.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [google, telegram_bot, telegram_otp]
                properties:
                  google: { type: boolean }
                  telegram_bot: { type: [string, "null"], description: Bot username for the Telegram Login Widget; null when disabled. }
                  telegram_otp: { type: boolean, description: The bot sends one-time login codes. }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/auth/google/start:
    get:
      operationId: googleStart
      security: []
      description: >-
        Starts "Sign in with Google" (OpenID Connect code flow with PKCE). Sets a short-lived HttpOnly
        `kyber_oauth` cookie holding state, nonce and PKCE verifier, then redirects to Google.
      responses:
        "302": { description: "Redirect to the Google consent screen" }
        "404": { description: Google sign-in is not configured }
  /api/v1/auth/google/callback:
    get:
      operationId: googleCallback
      security: []
      description: >-
        Google redirects here. The `state` must match this browser's `kyber_oauth` cookie; the ID token's
        signature, issuer, audience, expiry and nonce are verified. A verified email links to an existing
        account; an unverified one never does. On success sets `kyber_session` and redirects to `/`;
        on failure redirects to `/login?error=google_failed` or `google_email_taken`.
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        "302": { description: "Redirect to / when signed in, otherwise to /login?error=google_failed or google_email_taken" }
        "404": { description: Google sign-in is not configured }
  /api/v1/auth/telegram:
    post:
      operationId: telegramLogin
      security: []
      description: >-
        Signs in with the Telegram Login Widget payload (passed through unchanged). The HMAC-SHA256 of the
        fields is checked with the bot token and `auth_date` must be at most 24 h old. Answers like `login`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, auth_date, hash]
              properties:
                id: { type: integer }
                first_name: { type: string }
                last_name: { type: string }
                username: { type: string }
                photo_url: { type: string }
                auth_date: { type: integer }
                hash: { type: string }
      responses:
        "200":
          description: Logged in; also sets the `kyber_session` cookie.
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties: { token: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/auth/telegram/otp:
    post:
      operationId: telegramOtpStart
      security: []
      description: >-
        Starts "log in with a Telegram code". Open `link` (a t.me deep link) and press Start: the bot sends a
        6-digit code valid for 5 minutes. Throttled per client IP.
      responses:
        "201":
          description: Challenge created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, link, expires_at]
                properties:
                  id: { type: string, description: Keep it in the browser; needed to verify the code. }
                  link: { type: string, example: "https://t.me/kyber_bot?start=AbC123" }
                  expires_at: { type: string, format: date-time }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429":
          description: Too many code requests from this IP.
          headers:
            Retry-After: { schema: { type: integer } }
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Error" } } }
  /api/v1/auth/telegram/otp/verify:
    post:
      operationId: telegramOtpVerify
      security: []
      description: Checks the code from the bot (5 attempts, single use) and signs in like `login`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, code]
              properties: { id: { type: string }, code: { type: string, example: "123456" } }
      responses:
        "200":
          description: Logged in; also sets the `kyber_session` cookie.
          content:
            application/json:
              schema: { type: object, required: [token], properties: { token: { type: string } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        "204": { description: Session ended. }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/me:
    get:
      operationId: me
      responses:
        "200": { description: Current user, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "401": { $ref: "#/components/responses/Error" }

        "404": { $ref: "#/components/responses/Error" }
  /api/v1/meetings:
    get:
      operationId: listMeetings
      description: The caller's meetings in this workspace (the time table). Defaults to today and the next 7 days (UTC).
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Meeting" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      operationId: scheduleMeeting
      description: Books a meeting; the organizer always attends. During a meeting its attendees cannot run a Pomodoro.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, starts_at, ends_at]
              properties:
                title: { type: string }
                starts_at: { type: string, format: date-time }
                ends_at: { type: string, format: date-time }
                attendee_ids: { type: array, items: { type: string } }
      responses:
        "201": { description: Scheduled, content: { application/json: { schema: { $ref: "#/components/schemas/Meeting" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/meetings/{id}:
    delete:
      operationId: cancelMeeting
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Cancelled }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/focus:
    get:
      operationId: currentFocus
      description: The caller's running or paused Pomodoro (settled first; null when none).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties: { session: { oneOf: [{ $ref: "#/components/schemas/FocusSession" }, { type: "null" }] } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: startFocus
      description: >-
        Starts a Pomodoro (15-60 minutes, default 25) on an issue. Refused with 409 FOCUS_MEETING_CONFLICT when one of
        the caller's meetings falls inside it; a meeting that begins later ends the session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issue_key]
              properties: { issue_key: { type: string }, minutes: { type: integer, minimum: 15, maximum: 60, default: 25 } }
      responses:
        "201": { description: Started, content: { application/json: { schema: { $ref: "#/components/schemas/FocusSession" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/focus/pause:
    post:
      operationId: pauseFocus
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/FocusSession" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/focus/resume:
    post:
      operationId: resumeFocus
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/FocusSession" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/focus/stop:
    post:
      operationId: stopFocus
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/FocusSession" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/issues/{issueKey}/focus:
    parameters: [{ $ref: "#/components/parameters/IssueKey" }]
    get:
      operationId: issueFocusLog
      description: The issue's Pomodoro history (work log) in this workspace and the total focus time.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total_focused_seconds]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/FocusSession" } }
                  total_focused_seconds: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/workspaces:
    get:
      operationId: listWorkspaces
      description: The caller's workspaces (ADR-0004). Served on the apex domain and on workspace subdomains.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: { items: { type: array, items: { $ref: "#/components/schemas/Workspace" } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createWorkspace
      description: Creates a workspace (its subdomain is `slug`); the caller becomes its owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name]
              properties: { slug: { type: string, example: acme }, name: { type: string } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Workspace" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/projects:
    get:
      operationId: listProjects
      description: Projects the caller is a member of.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectList" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, name]
              properties:
                key: { $ref: "#/components/schemas/ProjectKey" }
                name: { type: string }
      responses:
        "201": { description: Created; the caller becomes admin., content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{key}:
    parameters: [{ $ref: "#/components/parameters/ProjectKey" }]
    get:
      operationId: getProject
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{key}/members:
    parameters: [{ $ref: "#/components/parameters/ProjectKey" }]
    get:
      operationId: listMembers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: { items: { type: array, items: { $ref: "#/components/schemas/Member" } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: setMember
      description: Add a user by email or change their role (admin only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "204": { description: Membership saved. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{key}/workflow:
    parameters: [{ $ref: "#/components/parameters/ProjectKey" }]
    get:
      operationId: getWorkflow
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Workflow" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: setWorkflow
      description: Replace the project's workflow (project admins). A status still holding issues cannot be removed (409).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Workflow" } } }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/Workflow" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{key}/boards:
    parameters: [{ $ref: "#/components/parameters/ProjectKey" }]
    get:
      operationId: listBoards
      description: The project's boards by name. A project gets a Kanban board (one column per status) on first use.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: { items: { type: array, items: { $ref: "#/components/schemas/Board" } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createBoard
      description: Create a board (project admins). Without columns, one column per workflow status.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BoardInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Board" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/boards/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getBoard
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Board" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: updateBoard
      description: Reconfigure a board (project admins); `version` must match (optimistic locking).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/BoardInput" }
                - { type: object, required: [version], properties: { version: { type: integer } } }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/Board" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteBoard
      description: Delete a board (project admins). The last board of a project cannot be deleted (409).
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{key}/audit:
    parameters: [{ $ref: "#/components/parameters/ProjectKey" }]
    get:
      operationId: projectAudit
      description: |
        The project's audit log (project admins): every write made through the API by a signed-in user —
        operation, path, result status, who and when — newest first, including refused attempts.
        Request bodies are never stored.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 200 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: { items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{key}/permissions:
    parameters: [{ $ref: "#/components/parameters/ProjectKey" }]
    get:
      operationId: projectPermissions
      description: |
        The project's permission scheme (project admins): every permission with its holders — a project
        role, a user, the issue's reporter or its assignee. `custom` is false while the project uses the default.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PermissionScheme" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: setProjectPermissions
      description: |
        Gives the project its own scheme (project admins). Permissions left out have no holders. The admin
        role must keep BROWSE_PROJECTS and ADMINISTER_PROJECTS (422 otherwise), so admins cannot be locked out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties: { permissions: { type: array, items: { $ref: "#/components/schemas/PermissionGrants" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PermissionScheme" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: resetProjectPermissions
      description: Returns the project to the default scheme (project admins).
      responses:
        "204": { description: Reset }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{key}/telegram-groups/link:
    parameters: [{ $ref: "#/components/parameters/ProjectKey" }]
    post:
      operationId: telegramGroupLink
      description: |
        Project admins: a one-time t.me/<bot>?startgroup=… link (10 minutes). Choosing a group adds the bot,
        which then posts the project's new issues, status changes and sprint starts/completions there.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [url, expires_at]
                properties:
                  url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{key}/telegram-groups:
    parameters: [{ $ref: "#/components/parameters/ProjectKey" }]
    get:
      operationId: telegramGroups
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [chat_id, title, linked_at]
                      properties:
                        chat_id: { type: string }
                        title: { type: string }
                        linked_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{key}/telegram-groups/{chat}:
    parameters:
      - { $ref: "#/components/parameters/ProjectKey" }
      - { name: chat, in: path, required: true, schema: { type: string } }
    delete:
      operationId: unlinkTelegramGroup
      responses:
        "204": { description: Disconnected }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{key}/issues:
    parameters: [{ $ref: "#/components/parameters/ProjectKey" }]
    get:
      operationId: listIssues
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/Status" } }
        - name: sprint
          in: query
          description: A sprint id, or `backlog` for issues in no sprint.
          schema: { type: string }
        - { name: fix_version, in: query, description: "Issues planned into this version.", schema: { type: string } }
      responses:
        "200": { description: Ordered by backlog rank., content: { application/json: { schema: { $ref: "#/components/schemas/IssueList" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createIssue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, type]
              properties:
                title: { type: string }
                type: { $ref: "#/components/schemas/IssueType" }
                parent_key: { type: string, description: "Epic for a story/task/bug; required for a sub-task (its story/task/bug)." }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Issue" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/issues/{issueKey}:
    parameters: [{ $ref: "#/components/parameters/IssueKey" }]
    get:
      operationId: getIssue
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Issue" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: editIssue
      description: Partial update guarded by optimistic locking. `assignee_id` null unassigns; omitted fields are unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer }
                title: { type: string }
                description: { type: string, maxLength: 20000 }
                priority: { $ref: "#/components/schemas/Priority" }
                assignee_id: { type: [string, "null"], format: uuid }
                sprint_id: { type: [string, "null"], description: "A planned or active sprint of the project; null = backlog." }
                estimate: { type: [number, "null"], minimum: 0, maximum: 999, description: "Story points, one decimal; null clears." }
                parent_key: { type: [string, "null"], description: "Move under this epic/issue; null removes the parent (not for sub-tasks)." }
                resolution: { $ref: "#/components/schemas/Resolution" }
                fix_versions: { type: array, items: { type: string }, description: "Replaces the fix versions (unarchived versions of the project)." }
                security_level: { type: string, enum: ["", confidential] }
      responses:
        "200": { description: Updated issue, content: { application/json: { schema: { $ref: "#/components/schemas/Issue" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/issues/{issueKey}/children:
    parameters: [{ $ref: "#/components/parameters/IssueKey" }]
    get:
      operationId: issueChildren
      description: An epic's issues or an issue's sub-tasks, with progress (Done-category statuses).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total, done, points, done_points]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Issue" } }
                  total: { type: integer }
                  done: { type: integer }
                  points: { type: number }
                  done_points: { type: number }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/issues/{issueKey}/links:
    parameters: [{ $ref: "#/components/parameters/IssueKey" }]
    get:
      operationId: issueLinks
      description: The issue's links read from its side; links to issues the caller may not read are left out.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: { items: { type: array, items: { $ref: "#/components/schemas/IssueLink" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: linkIssue
      description: "Link this issue to another: <this> blocks / relates to / duplicates / clones <to_key>."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, to_key]
              properties:
                type: { type: string, enum: [blocks, relates, duplicates, clones] }
                to_key: { type: string }
      responses:
        "201": { description: Linked, content: { application/json: { schema: { $ref: "#/components/schemas/IssueLink" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/links/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    delete:
      operationId: unlinkIssue
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/issues/{issueKey}/history:
    parameters: [{ $ref: "#/components/parameters/IssueKey" }]
    get:
      operationId: issueHistory
      description: |
        Every action on the issue, oldest first (Jira's History tab): creation, each changed field with its
        old and new value, comments and imports. Actions before v0.14 were recovered from the event log;
        their actor may be unknown (null) and old edits carry no values.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: { items: { type: array, items: { $ref: "#/components/schemas/HistoryEntry" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/issues/{issueKey}/rank:
    parameters: [{ $ref: "#/components/parameters/IssueKey" }]
    post:
      operationId: rankIssue
      description: Move the issue directly after or before another issue of the same project (exactly one of the two).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                after: { type: string, example: KYB-3 }
                before: { type: string, example: KYB-1 }
      responses:
        "200": { description: Re-ranked issue, content: { application/json: { schema: { $ref: "#/components/schemas/Issue" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{key}/sprints:
    parameters: [{ $ref: "#/components/parameters/ProjectKey" }]
    get:
      operationId: listSprints
      description: Active first, then planned (oldest first), then closed (newest first).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: { items: { type: array, items: { $ref: "#/components/schemas/Sprint" } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createSprint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
                goal: { type: string, maxLength: 2000 }
      responses:
        "201": { description: Planned sprint, content: { application/json: { schema: { $ref: "#/components/schemas/Sprint" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/sprints/{id}/start:
    parameters: [{ $ref: "#/components/parameters/SprintID" }]
    post:
      operationId: startSprint
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ends_at: { type: string, format: date-time, description: Defaults to start + 14 days. }
      responses:
        "200": { description: Active sprint, content: { application/json: { schema: { $ref: "#/components/schemas/Sprint" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/sprints/{id}/complete:
    parameters: [{ $ref: "#/components/parameters/SprintID" }]
    post:
      operationId: completeSprint
      description: |
        Closes the active sprint. Issues that are not done are carried over to `move_to` (a planned sprint of the
        same project, 422 otherwise) or, without it, to the backlog; the sprint report lists them as not completed.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: { move_to: { type: string, description: "A planned sprint's id; empty = backlog." } }
      responses:
        "200":
          description: Completion summary
          content:
            application/json:
              schema:
                type: object
                required: [sprint, completed, returned]
                additionalProperties: false
                properties:
                  sprint: { $ref: "#/components/schemas/Sprint" }
                  completed: { type: integer, description: Done issues kept with the closed sprint. }
                  returned: { type: integer, description: Unfinished issues carried over to the backlog or the next sprint. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{key}/import/jira:
    parameters: [{ $ref: "#/components/parameters/ProjectKey" }]
    post:
      operationId: importJira
      description: >-
        Imports a Jira CSV export (project admins only, 10 MB max). `dry_run=true` (default) previews without
        changing anything. A run is idempotent: issues imported earlier are listed in `skipped`. Imported issues
        keep their status and original created/resolved dates in reports, and notify nobody. A run that fails
        midway answers 207 with what it created; running it again resumes.
      parameters:
        - { name: dry_run, in: query, schema: { type: string, enum: ["true", "false"], default: "true" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csv]
              properties: { csv: { type: string, description: CSV text as exported by Jira } }
      responses:
        "200": { description: Preview, content: { application/json: { schema: { $ref: "#/components/schemas/ImportReport" } } } }
        "201": { description: Imported, content: { application/json: { schema: { $ref: "#/components/schemas/ImportReport" } } } }
        "207": { description: Stopped midway; re-run to resume, content: { application/json: { schema: { $ref: "#/components/schemas/ImportReport" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{key}/export.csv:
    parameters: [{ $ref: "#/components/parameters/ProjectKey" }]
    get:
      operationId: exportCsv
      description: >-
        Every issue of the project as a Jira-compatible CSV (UTF-8 with BOM); people are exported by email.
        The file imports back through `importJira`. Cells starting with = + - @ are prefixed with ' to defuse spreadsheet formulas.
      responses:
        "200": { description: CSV file, content: { text/csv: { schema: { type: string } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{key}/reports/summary:
    parameters: [{ $ref: "#/components/parameters/ProjectKey" }]
    get:
      operationId: reportSummary
      description: Current totals and distributions; workload counts open issues; cycle time covers issues done in the last 30 days.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [total, open, done, unassigned, total_points, open_points, by_status, by_type, by_priority, workload, cycle_time]
                properties:
                  total: { type: integer }
                  open: { type: integer }
                  done: { type: integer }
                  unassigned: { type: integer }
                  total_points: { type: number }
                  open_points: { type: number }
                  by_status: { type: array, items: { $ref: "#/components/schemas/Bucket" } }
                  by_type: { type: array, items: { $ref: "#/components/schemas/Bucket" } }
                  by_priority: { type: array, items: { $ref: "#/components/schemas/Bucket" } }
                  workload:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [user_id, name, count, points]
                      properties:
                        user_id: { type: [string, "null"], description: null = unassigned }
                        name: { type: string }
                        count: { type: integer }
                        points: { type: number }
                  cycle_time:
                    type: object
                    additionalProperties: false
                    required: [count, average_hours, median_hours]
                    properties:
                      count: { type: integer }
                      average_hours: { type: number }
                      median_hours: { type: number }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{key}/reports/created-vs-resolved:
    parameters: [{ $ref: "#/components/parameters/ProjectKey" }]
    get:
      operationId: reportCreatedVsResolved
      parameters:
        - { name: days, in: query, schema: { type: string }, description: "1-365, default 30 (UTC days ending today)." }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [days]
                properties:
                  days:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [date, created, resolved, cum_created, cum_resolved]
                      properties:
                        date: { type: string, format: date }
                        created: { type: integer }
                        resolved: { type: integer }
                        cum_created: { type: integer }
                        cum_resolved: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{key}/reports/velocity:
    parameters: [{ $ref: "#/components/parameters/ProjectKey" }]
    get:
      operationId: reportVelocity
      description: The last seven closed sprints, oldest first.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [sprints]
                properties:
                  sprints:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, name, committed_points, completed_points, completed_issues]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        committed_points: { type: number }
                        completed_points: { type: number }
                        completed_issues: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{key}/versions:
    parameters: [{ $ref: "#/components/parameters/ProjectKey" }]
    get:
      operationId: listVersions
      description: The project's versions (releases) with progress over the issues the caller may see; dated ones first.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: { items: { type: array, items: { $ref: "#/components/schemas/Version" } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createVersion
      description: Project admins add a version.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/VersionInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Version" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/versions/{id}:
    parameters: [{ $ref: "#/components/parameters/VersionID" }]
    patch:
      operationId: editVersion
      description: Project admins edit a version loaded at `version` (optimistic locking).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf: [{ $ref: "#/components/schemas/VersionInput" }]
              required: [version]
              properties: { version: { type: integer } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Version" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteVersion
      description: Project admins delete a version; its issues move to `move_to` or lose the version.
      parameters:
        - { name: move_to, in: query, schema: { type: string }, description: "Another unarchived version of the project." }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/versions/{id}/release:
    parameters: [{ $ref: "#/components/parameters/VersionID" }]
    post:
      operationId: releaseVersion
      description: Project admins release an unreleased version; unresolved issues move to `move_to` (another unreleased version) or stay.
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, properties: { move_to: { type: string } } } } }
      responses:
        "200":
          description: Released
          content:
            application/json:
              schema:
                type: object
                required: [version, moved]
                properties: { version: { $ref: "#/components/schemas/Version" }, moved: { type: integer } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/versions/{id}/unrelease:
    parameters: [{ $ref: "#/components/parameters/VersionID" }]
    post:
      operationId: unreleaseVersion
      description: Project admins. Reopens a released version.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Version" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/versions/{id}/archive:
    parameters: [{ $ref: "#/components/parameters/VersionID" }]
    post:
      operationId: archiveVersion
      description: Project admins. Hides a version from pickers; it keeps its issues.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Version" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/versions/{id}/restore:
    parameters: [{ $ref: "#/components/parameters/VersionID" }]
    post:
      operationId: restoreVersion
      description: Project admins. Brings an archived version back.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Version" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/versions/{id}/issues:
    parameters: [{ $ref: "#/components/parameters/VersionID" }]
    get:
      operationId: versionIssues
      description: The version and the issues planned into it that the caller may see.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [version, items]
                properties:
                  version: { $ref: "#/components/schemas/Version" }
                  items:
                    type: array
                    items:
                      type: object
                      required: [key, title, type, done, resolution]
                      properties:
                        key: { type: string }
                        title: { type: string }
                        type: { type: string }
                        done: { type: boolean }
                        resolution: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/versions/{id}/release-notes:
    parameters: [{ $ref: "#/components/parameters/VersionID" }]
    get:
      operationId: releaseNotes
      description: Markdown release notes from the version's issues the caller may see, grouped by type.
      responses:
        "200": { description: OK, content: { text/markdown: { schema: { type: string } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/sprints/{id}/report:
    parameters: [{ $ref: "#/components/parameters/SprintID" }]
    get:
      operationId: sprintReport
      description: |
        Jira's sprint report: committed scope at the start, scope added later, and the issues completed, not
        completed (carried over at completion) and removed. Only issues the caller may see are counted.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [sprint, committed_points, committed_issues, added_points, added_issues, completed_points, completed, not_completed, removed]
                properties:
                  sprint:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
                      state: { type: string, enum: [planned, active, closed] }
                      started_at: { type: [string, "null"], format: date-time }
                      ends_at: { type: [string, "null"], format: date-time }
                      completed_at: { type: [string, "null"], format: date-time }
                  committed_points: { type: number }
                  committed_issues: { type: integer }
                  added_points: { type: number }
                  added_issues: { type: integer }
                  completed_points: { type: number }
                  completed: { type: array, items: { $ref: "#/components/schemas/SprintReportIssue" } }
                  not_completed: { type: array, items: { $ref: "#/components/schemas/SprintReportIssue" } }
                  removed: { type: array, items: { $ref: "#/components/schemas/SprintReportIssue" } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/sprints/{id}/burndown:
    parameters: [{ $ref: "#/components/parameters/SprintID" }]
    get:
      operationId: sprintBurndown
      description: Remaining work from the sprint start until now (or completion), as a step line, plus the ideal line to the end date.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [sprint, start_points, start_issues, added_points, added_issues, removed_issues, samples, ideal]
                properties:
                  sprint:
                    type: object
                    additionalProperties: false
                    required: [id, name, state, started_at, ends_at, completed_at]
                    properties:
                      id: { type: string }
                      name: { type: string }
                      state: { type: string, enum: [planned, active, closed] }
                      started_at: { type: [string, "null"], format: date-time }
                      ends_at: { type: [string, "null"], format: date-time }
                      completed_at: { type: [string, "null"], format: date-time }
                  start_points: { type: number }
                  start_issues: { type: integer }
                  added_points: { type: number }
                  added_issues: { type: integer }
                  removed_issues: { type: integer }
                  samples: { type: array, items: { $ref: "#/components/schemas/BurndownSample" } }
                  ideal: { type: array, items: { $ref: "#/components/schemas/BurndownSample" } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/me/telegram/connect:
    post:
      operationId: connectTelegram
      description: |
        A one-time deep link (t.me/<bot>?start=…, valid 10 minutes) that connects the caller's Telegram for
        notifications once they press Start in the bot. 404 when no Telegram bot is configured.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [url, expires_at]
                properties:
                  url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/me/notification-settings:
    get:
      operationId: getNotificationSettings
      description: |
        Where the caller's notifications go besides the in-app inbox. A channel is used only when the server
        has it configured (`*_available`) and, for Telegram, the user connected a chat.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationSettings" } } } }
        "401": { $ref: "#/components/responses/Error" }
    put:
      operationId: setNotificationSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: boolean }
                telegram: { type: boolean }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationSettings" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/notifications:
    get:
      operationId: listNotifications
      description: The caller's notifications, newest first (at most 50), plus the unread count.
      parameters:
        - { name: unread, in: query, schema: { type: string, enum: ["true", "false"] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, unread]
                additionalProperties: false
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Notification" } }
                  unread: { type: integer, minimum: 0 }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/notifications/{id}/read:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      operationId: markNotificationRead
      responses:
        "204": { description: Marked as read. }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      responses:
        "204": { description: All marked as read. }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/issues/{issueKey}/transitions:
    parameters: [{ $ref: "#/components/parameters/IssueKey" }]
    post:
      operationId: transitionIssue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { $ref: "#/components/schemas/Status" }
                resolution:
                  description: How the issue ends when `to` is a Done status (default done); only valid for Done statuses.
                  allOf: [{ $ref: "#/components/schemas/Resolution" }]
      responses:
        "200": { description: Moved, content: { application/json: { schema: { $ref: "#/components/schemas/Issue" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/issues/{issueKey}/comments:
    parameters: [{ $ref: "#/components/parameters/IssueKey" }]
    get:
      operationId: listComments
      responses:
        "200":
          description: Oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: { items: { type: array, items: { $ref: "#/components/schemas/Comment" } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: addComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties: { body: { type: string, maxLength: 10000 } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Comment" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
    cookie: { type: apiKey, in: cookie, name: kyber_session }
  parameters:
    ProjectKey: { name: key, in: path, required: true, schema: { type: string } }
    IssueKey: { name: issueKey, in: path, required: true, schema: { type: string }, example: KYB-12 }
    SprintID: { name: id, in: path, required: true, schema: { type: string } }
    VersionID: { name: id, in: path, required: true, schema: { type: string } }
  responses:
    Error:
      description: RFC 9457 problem details; `title` is localized from Accept-Language (en, uz, ru).
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Error" } } }
    Status:
      description: Probe result
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties: { status: { type: string, enum: [ok, unavailable] } }
  schemas:
    Meeting:
      type: object
      additionalProperties: false
      required: [id, title, starts_at, ends_at, organizer_id, attendee_ids]
      properties:
        id: { type: string }
        title: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        organizer_id: { type: string }
        attendee_ids: { type: array, items: { type: string } }
    FocusSession:
      type: object
      additionalProperties: false
      required: [id, issue_key, user_id, state, planned_minutes, started_at, ended_at, focused_seconds, remaining_seconds, remaining_ms, ends_at, server_time, reason]
      properties:
        id: { type: string }
        issue_key: { type: string }
        user_id: { type: string }
        state: { type: string, enum: [running, paused, completed, interrupted] }
        planned_minutes: { type: integer }
        started_at: { type: string, format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        focused_seconds: { type: integer }
        remaining_seconds: { type: integer }
        remaining_ms: { type: integer, description: Exact time left in milliseconds. }
        ends_at: { type: [string, "null"], format: date-time, description: "Absolute deadline while running (null when paused or ended)." }
        server_time: { type: string, format: date-time, description: Server clock when the response was made; clients use it to correct skew. }
        reason: { type: string, description: "Why it was interrupted: stopped, or meeting: <title>" }
    Workspace:
      type: object
      additionalProperties: false
      required: [id, slug, name, role, url]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        role: { type: string, enum: [owner, admin, member, ""] }
        url: { type: string, description: "https://<slug>.<base domain>/ (\"/\" in single-tenant mode)" }
    ImportReport:
      type: object
      additionalProperties: false
      required: [dry_run, items, errors, skipped]
      properties:
        dry_run: { type: boolean }
        skipped: { type: array, items: { type: string }, description: External keys imported by an earlier run }
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [line, external_key, message]
            properties: { line: { type: integer }, external_key: { type: string }, message: { type: string } }
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [line, external_key, issue_key, title, type, status, priority, assignee_id, points, created_at, resolved_at, warnings]
            properties:
              line: { type: integer }
              external_key: { type: string, example: PROJ-12 }
              issue_key: { type: [string, "null"], description: null in a preview }
              title: { type: string }
              type: { type: string }
              status: { type: string }
              priority: { type: string }
              assignee_id: { type: [string, "null"] }
              points: { type: [number, "null"] }
              created_at: { type: [string, "null"], format: date-time }
              resolved_at: { type: [string, "null"], format: date-time }
              warnings: { type: array, items: { type: string } }
    Error:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string, description: Localized summary of the error code. }
        status: { type: integer }
        detail: { type: string, description: The specific reason for this occurrence. }
        instance: { type: string }
        code: { type: string, description: "Stable Kyber error code, e.g. ISSUE_NOT_FOUND. Branch on this." }
        numeric_code: { type: integer }
    User:
      type: object
      required: [id, email, name]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
    ProjectKey: { type: string, pattern: "^[A-Z][A-Z0-9]{1,9}$" }
    Project:
      type: object
      required: [id, key, name]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        key: { $ref: "#/components/schemas/ProjectKey" }
        name: { type: string }
    ProjectList:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: "#/components/schemas/Project" } } }
    Role: { type: string, enum: [admin, member, viewer] }
    Member:
      type: object
      required: [user_id, email, name, role]
      additionalProperties: false
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    Status:
      type: string
      pattern: "^[a-z0-9_]{1,40}$"
      description: A status id of the project's workflow (default workflow — todo, in_progress, done).
    StatusCategory: { type: string, enum: [todo, in_progress, done] }
    Resolution:
      type: string
      enum: [done, wont_do, duplicate, cannot_reproduce]
    Version:
      type: object
      required: [id, project_key, name, description, release_date, state, released_at, version]
      properties:
        id: { type: string }
        project_key: { type: string }
        name: { type: string, maxLength: 60 }
        description: { type: string, maxLength: 2000 }
        release_date: { type: [string, "null"], format: date-time }
        state: { type: string, enum: [unreleased, released, archived] }
        released_at: { type: [string, "null"], format: date-time }
        version: { type: integer }
        issues: { type: integer, description: "Issues planned into it (listing only)." }
        done: { type: integer, description: "Of those, in a Done status (listing only)." }
        unresolved: { type: integer, description: "Of those, unresolved (listing only)." }
    VersionInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        description: { type: string, maxLength: 2000 }
        release_date: { type: [string, "null"], format: date-time }
    SprintReportIssue:
      type: object
      required: [key, title, type, points, status_category, added_after_start]
      properties:
        key: { type: string }
        title: { type: string }
        type: { type: string }
        points: { type: number }
        status_category: { type: string }
        added_after_start: { type: boolean }
    PermissionGrants:
      type: object
      required: [permission, grants]
      properties:
        permission:
          type: string
          enum: [BROWSE_PROJECTS, CREATE_ISSUES, EDIT_ISSUES, DELETE_ISSUES, ASSIGN_ISSUES, ASSIGNABLE_USER, TRANSITION_ISSUES,
            CLOSE_ISSUES, ADD_COMMENTS, EDIT_ALL_COMMENTS, DELETE_ALL_COMMENTS, MANAGE_SPRINTS, ADMINISTER_PROJECTS]
        grants:
          type: array
          items:
            type: object
            required: [kind, value]
            properties:
              kind: { type: string, enum: [role, user, reporter, assignee] }
              value: { type: string, description: "Role id (admin, member, viewer) or user id; empty for reporter/assignee." }
    PermissionScheme:
      type: object
      required: [custom, permissions]
      properties:
        custom: { type: boolean }
        permissions: { type: array, items: { $ref: "#/components/schemas/PermissionGrants" } }
    AuditEntry:
      type: object
      additionalProperties: false
      required: [at, actor_id, actor_name, action, target, status]
      properties:
        at: { type: string, format: date-time }
        actor_id: { type: string }
        actor_name: { type: string }
        action: { type: string, description: "The API operation, e.g. PUT /api/v1/projects/{key}/workflow" }
        target: { type: string, description: The concrete path }
        status: { type: integer, description: The HTTP status of the result }
    IssueLink:
      type: object
      additionalProperties: false
      required: [id, type, phrase, issue]
      properties:
        id: { type: string }
        type: { type: string, enum: [blocks, relates, duplicates, clones] }
        phrase: { type: string, description: "Read from the requested issue's side, e.g. 'is blocked by'" }
        issue: { $ref: "#/components/schemas/Issue" }
    NotificationSettings:
      type: object
      additionalProperties: false
      required: [email, telegram, email_available, telegram_available, telegram_connected]
      properties:
        email: { type: boolean }
        telegram: { type: boolean }
        email_available: { type: boolean, description: SMTP is configured on this server }
        telegram_available: { type: boolean, description: A Telegram bot is configured on this server }
        telegram_connected: { type: boolean, description: The user connected their Telegram chat }
    HistoryEntry:
      type: object
      additionalProperties: false
      required: [at, by_id, by_name, field, from, to, from_name, to_name]
      properties:
        at: { type: string, format: date-time }
        by_id: { type: [string, "null"], description: "null = the system or unknown (recovered history)" }
        by_name: { type: string }
        field:
          type: string
          description: "created, comment, imported, link, or a field: title, description, type, status, priority, assignee, estimate, sprint, rank, parent"
        from: { type: string }
        to: { type: string }
        from_name: { type: string, description: "Display value (people's names for assignee)" }
        to_name: { type: string }
    BoardColumn:
      type: object
      description: A column shows the issues in its statuses. `min`/`max` are WIP limits (0 = none).
      required: [name, statuses]
      properties:
        name: { type: string, maxLength: 60 }
        statuses: { type: array, items: { $ref: "#/components/schemas/Status" } }
        min: { type: integer, minimum: 0 }
        max: { type: integer, minimum: 0 }
    BoardInput:
      type: object
      required: [name, kind]
      properties:
        name: { type: string, maxLength: 60 }
        kind: { type: string, enum: [scrum, kanban] }
        columns: { type: array, items: { $ref: "#/components/schemas/BoardColumn" } }
    Board:
      type: object
      required: [id, project_key, name, kind, columns, version]
      properties:
        id: { type: string }
        project_key: { type: string }
        name: { type: string }
        kind: { type: string, enum: [scrum, kanban] }
        columns: { type: array, items: { $ref: "#/components/schemas/BoardColumn" } }
        version: { type: integer }
    WorkflowStatus:
      type: object
      required: [id, name, category]
      properties:
        id: { $ref: "#/components/schemas/Status" }
        name: { type: string, maxLength: 60 }
        category: { $ref: "#/components/schemas/StatusCategory" }
    Workflow:
      type: object
      description: Statuses in board-column order. No transitions means every status can reach every other one.
      required: [initial, statuses, transitions]
      properties:
        initial: { $ref: "#/components/schemas/Status" }
        statuses: { type: array, items: { $ref: "#/components/schemas/WorkflowStatus" } }
        transitions:
          type: array
          items:
            type: object
            required: [from, to]
            properties: { from: { $ref: "#/components/schemas/Status" }, to: { $ref: "#/components/schemas/Status" } }
    IssueType: { type: string, enum: [epic, story, task, bug, subtask] }
    Priority: { type: string, enum: [lowest, low, medium, high, highest] }
    Issue:
      type: object
      required: [id, key, title, type, status, description, priority, assignee_id, reporter_id, sprint_id, estimate, rank, parent_key, security_level, resolution, fix_versions, version]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        key: { type: string, pattern: "^[A-Z][A-Z0-9]{1,9}-[1-9][0-9]*$" }
        title: { type: string, minLength: 1 }
        type: { $ref: "#/components/schemas/IssueType" }
        status: { $ref: "#/components/schemas/Status" }
        description: { type: string }
        priority: { $ref: "#/components/schemas/Priority" }
        assignee_id: { type: [string, "null"], format: uuid }
        reporter_id: { type: [string, "null"], format: uuid, description: Creator; null for issues created before 0.6. }
        estimate: { type: [number, "null"], minimum: 0, maximum: 999, description: Story points (one decimal). }
        sprint_id: { type: [string, "null"], format: uuid }
        rank: { type: string, description: Fractional backlog rank; compare byte-wise. }
        parent_key: { type: [string, "null"], description: "The epic of a story/task/bug, or the issue a sub-task belongs to." }
        fix_versions: { type: array, items: { type: string }, description: "Ids of the versions (releases) the issue is planned to ship in." }
        resolution:
          description: How a resolved issue ended; "" while it is not in a Done status.
          type: string
          enum: ["", done, wont_do, duplicate, cannot_reproduce]
        security_level:
          type: string
          enum: ["", confidential]
          description: "Issue security (ADR-0003). confidential = only project admins, the reporter and the assignee can see it; it is hidden (404) from everyone else and left out of every list, report, export and notification."
        version: { type: integer, minimum: 1 }
    Sprint:
      type: object
      required: [id, project_key, name, goal, state, started_at, ends_at, completed_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        project_key: { $ref: "#/components/schemas/ProjectKey" }
        name: { type: string, minLength: 1 }
        goal: { type: string }
        state: { type: string, enum: [planned, active, closed] }
        started_at: { type: [string, "null"], format: date-time }
        ends_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
    Bucket:
      type: object
      additionalProperties: false
      required: [key, count, points]
      properties:
        key: { type: string }
        count: { type: integer }
        points: { type: number }
    BurndownSample:
      type: object
      additionalProperties: false
      required: [at, remaining_points, remaining_issues]
      properties:
        at: { type: string, format: date-time }
        remaining_points: { type: number }
        remaining_issues: { type: integer }
    Notification:
      type: object
      required: [id, kind, issue_key, issue_title, actor_name, excerpt, read, created_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [assigned, commented, mentioned] }
        issue_key: { type: string }
        issue_title: { type: string }
        actor_name: { type: string }
        excerpt: { type: string, description: Start of the comment (commented/mentioned). }
        read: { type: boolean }
        created_at: { type: string, format: date-time }
    IssueList:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: "#/components/schemas/Issue" } } }
    Comment:
      type: object
      required: [id, author_id, author_name, body, created_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        author_id: { type: string, format: uuid }
        author_name: { type: string }
        body: { type: string, minLength: 1 }
        created_at: { type: string, format: date-time }
