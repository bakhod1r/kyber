    put:
      operationId: editCustomField
      description: Project admins rename a field or change a select field's options (at `version`); the type stays.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf: [{ $ref: "#/components/schemas/CustomFieldInput" }]
              required: [version]
              properties: { version: { type: integer } }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/CustomField" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteCustomField
      description: Project admins delete a field; its values are no longer shown or searched.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/sprints/{id}/report:
    parameters: [{ $ref: "#/components/parameters/SprintID" }]
    get:
      operationId: sprintReport
      description: |
        Jira's sprint report: committed scope at the start, scope added later, and the issues completed, not
        completed (carried over at completion) and removed. Only issues the caller may see are counted.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [sprint, committed_points, committed_issues, added_points, added_issues, completed_points, completed, not_completed, removed,
                  time_original_seconds, time_spent_seconds, time_remaining_seconds]
                properties:
                  sprint:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
                      state: { type: string, enum: [planned, active, closed] }
                      started_at: { type: [string, "null"], format: date-time }
                      ends_at: { type: [string, "null"], format: date-time }
                      completed_at: { type: [string, "null"], format: date-time }
                  committed_points: { type: number }
                  committed_issues: { type: integer }
                  added_points: { type: number }
                  added_issues: { type: integer }
                  completed_points: { type: number }
                  time_original_seconds: { type: integer, description: "Original estimates of the issues kept in the sprint." }
                  time_spent_seconds: { type: integer, description: "Time logged on them." }
                  time_remaining_seconds: { type: integer, description: "Their remaining estimates." }
                  completed: { type: array, items: { $ref: "#/components/schemas/SprintReportIssue" } }
                  not_completed: { type: array, items: { $ref: "#/components/schemas/SprintReportIssue" } }
                  removed: { type: array, items: { $ref: "#/components/schemas/SprintReportIssue" } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/sprints/{id}/burndown:
    parameters: [{ $ref: "#/components/parameters/SprintID" }]
    get:
      operationId: sprintBurndown
      description: Remaining work from the sprint start until now (or completion), as a step line, plus the ideal line to the end date.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [sprint, start_points, start_issues, added_points, added_issues, removed_issues, samples, ideal]
                properties:
                  sprint:
                    type: object
                    additionalProperties: false
                    required: [id, name, state, started_at, ends_at, completed_at]
                    properties:
                      id: { type: string }
                      name: { type: string }
                      state: { type: string, enum: [planned, active, closed] }
                      started_at: { type: [string, "null"], format: date-time }
                      ends_at: { type: [string, "null"], format: date-time }
                      completed_at: { type: [string, "null"], format: date-time }
                  start_points: { type: number }
                  start_issues: { type: integer }
                  added_points: { type: number }
                  added_issues: { type: integer }
                  removed_issues: { type: integer }
                  samples: { type: array, items: { $ref: "#/components/schemas/BurndownSample" } }
                  ideal: { type: array, items: { $ref: "#/components/schemas/BurndownSample" } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/me/telegram/connect:
    post:
      operationId: connectTelegram
      description: |
        A one-time deep link (t.me/<bot>?start=…, valid 10 minutes) that connects the caller's Telegram for
        notifications once they press Start in the bot. 404 when no Telegram bot is configured.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [url, expires_at]
                properties:
                  url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/me/notification-settings:
    get:
      operationId: getNotificationSettings
      description: |
        Where the caller's notifications go besides the in-app inbox. A channel is used only when the server
        has it configured (`*_available`) and, for Telegram, the user connected a chat.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationSettings" } } } }
        "401": { $ref: "#/components/responses/Error" }
    put:
      operationId: setNotificationSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: boolean }
                telegram: { type: boolean }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationSettings" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/notifications:
    get:
      operationId: listNotifications
      description: The caller's notifications, newest first (at most 50), plus the unread count.
      parameters:
        - { name: unread, in: query, schema: { type: string, enum: ["true", "false"] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, unread]
                additionalProperties: false
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Notification" } }
                  unread: { type: integer, minimum: 0 }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/notifications/{id}/read:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      operationId: markNotificationRead
      responses:
        "204": { description: Marked as read. }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      description: Marks every notification read, or with conversation_id only the chat mentions in that conversation.
      parameters:
        - { name: conversation_id, in: query, schema: { type: string } }
      responses:
        "204": { description: All marked as read. }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/issues/{issueKey}/transitions:
    parameters: [{ $ref: "#/components/parameters/IssueKey" }]
    post:
      operationId: transitionIssue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { $ref: "#/components/schemas/Status" }
                resolution:
                  description: How the issue ends when `to` is a Done status (default done); only valid for Done statuses.
                  allOf: [{ $ref: "#/components/schemas/Resolution" }]
      responses:
        "200": { description: Moved, content: { application/json: { schema: { $ref: "#/components/schemas/Issue" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/issues/{issueKey}/comments:
    parameters: [{ $ref: "#/components/parameters/IssueKey" }]
    get:
      operationId: listComments
      responses:
        "200":
          description: Oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: { items: { type: array, items: { $ref: "#/components/schemas/Comment" } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: addComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties: { body: { type: string, maxLength: 10000 } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Comment" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
    cookie: { type: apiKey, in: cookie, name: kyber_session }
  parameters:
    ProjectKey: { name: key, in: path, required: true, schema: { type: string } }
    IssueKey: { name: issueKey, in: path, required: true, schema: { type: string }, example: KYB-12 }
    SprintID: { name: id, in: path, required: true, schema: { type: string } }
    VersionID: { name: id, in: path, required: true, schema: { type: string } }
  responses:
    Error:
      description: RFC 9457 problem details; `title` is localized from Accept-Language (en, uz, ru).
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Error" } } }
    Status:
      description: Probe result
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties: { status: { type: string, enum: [ok, unavailable] } }
  requestBodies:
    MessageBody:
      required: true
      content:
        application/json:
          schema: { type: object, required: [body], properties: { body: { type: string } } }
  schemas:
    Whiteboard:
      type: object
      required: [id, conversation_id, title, created_by, created_at]
      properties:
        id: { type: string }
        conversation_id: { type: string }
        title: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        elements: { type: array, items: { $ref: "#/components/schemas/WhiteboardElement" } }
    WhiteboardElement:
      type: object
      required: [id, kind, x, y, w, h, points, text, color, version]
      properties:
        id: { type: string }
        kind: { type: string, description: "rect, ellipse, arrow, line, freehand, text or sticky" }
        x: { type: number }
        y: { type: number }
        w: { type: number }
        h: { type: number }
        points: { type: array, items: { type: object, required: [x, y], properties: { x: { type: number }, y: { type: number } } } }
        text: { type: string }
        color: { type: string }
        version: { type: integer }
        updated_by: { type: string }
        updated_at: { type: string, format: date-time }
        deleted: { type: boolean }
    ConversationPrefs:
      type: object
      required: [conversation_id, level, section]
      properties:
        conversation_id: { type: string }
        level: { type: string, enum: [all, mentions, muted] }
        section: { type: string }
    GroupInput:
      type: object
      required: [handle, member_ids]
      properties:
        handle: { type: string, description: "2–30 lower-case letters, digits or dashes" }
        name: { type: string }
        member_ids: { type: array, items: { type: string } }
    UserGroup:
      type: object
      required: [id, handle, name, member_ids, created_by, created_at]
      properties:
        id: { type: string }
        handle: { type: string }
        name: { type: string }
        member_ids: { type: array, items: { type: string } }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
    ScheduleInput:
      type: object
      required: [body, send_at]
      properties: { body: { type: string }, send_at: { type: string, format: date-time } }
    ScheduledMessage:
      type: object
      required: [id, conversation_id, body, send_at, created_at]
      properties:
        id: { type: string }
        conversation_id: { type: string }
        body: { type: string }
        send_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    UserStatus:
      type: object
      required: [user_id, emoji, text, expires_at, dnd, dnd_until]
      properties:
        user_id: { type: string }
        emoji: { type: string }
        text: { type: string }
        expires_at: { type: [string, "null"], format: date-time }
        dnd: { type: boolean }
        dnd_until: { type: [string, "null"], format: date-time }
    Call:
      type: object
      required: [id, conversation_id, started_by, started_at, live, participants, presentation, recording]
      properties:
        id: { type: string }
        conversation_id: { type: string }
        started_by: { type: string }
        started_at: { type: string, format: date-time }
        live: { type: boolean }
        presentation:
          oneOf:
            - { type: "null" }
            - { type: object, required: [kind, ref, by], properties: { kind: { type: string, enum: [doc, whiteboard] }, ref: { type: string }, by: { type: string } } }
        recording:
          oneOf:
            - { type: "null" }
            - { type: object, required: [by, since], properties: { by: { type: string }, since: { type: string, format: date-time } } }
        participants:
          type: array
          items:
            type: object
            required: [user_id, joined_at, audio, video, screen, hand]
            properties:
              user_id: { type: string }
              joined_at: { type: string, format: date-time }
              audio: { type: boolean }
              video: { type: boolean }
              screen: { type: boolean }
              hand: { type: boolean, description: "A raised hand (S75), until lowered" }
    Conversation:
      type: object
      required: [id, kind, name, topic, private, member_ids, member, unread, created_at, owner_id, admin_ids, archived, project_key]
      properties:
        id: { type: string }
        owner_id: { type: string, description: Who created it; owns a channel. }
        project_key: { type: string, description: "The project whose news are posted here (S73); empty when not linked." }
        admin_ids: { type: array, items: { type: string }, description: "Channel admins besides the owner (S69)." }
        archived: { type: boolean, description: An archived channel is read-only. }
        kind: { type: string, enum: [channel, dm] }
        name: { type: string, description: Empty for DMs }
        topic: { type: string }
        private: { type: boolean }
        member_ids: { type: array, items: { type: string } }
        member: { type: boolean, description: Whether the caller belongs to it }
        unread: { type: integer }
        created_at: { type: string, format: date-time }
    Message:
      type: object
      required: [id, conversation_id, author_id, body, created_at, edited_at, deleted, thread_id, reply_count, reactions, issues, kind, file, pinned_by, pinned_at]
      properties:
        id: { type: string }
        conversation_id: { type: string }
        author_id: { type: string }
        body: { type: string, description: Empty once deleted }
        created_at: { type: string, format: date-time }
        edited_at: { oneOf: [{ type: string, format: date-time }, { type: "null" }] }
        deleted: { type: boolean }
        thread_id: { oneOf: [{ type: string }, { type: "null" }], description: The parent message of a reply }
        reply_count: { type: integer }
        kind: { type: string, enum: ["", huddle_started, huddle_ended, huddle_recording, project_event, transcript], description: "Empty for people's messages; system messages cannot be edited." }
        file:
          description: An attached file; download it from url (members of the conversation only).
          oneOf:
            - { type: "null" }
            - { type: object, required: [name, type, size, url], properties: { name: { type: string }, type: { type: string }, size: { type: integer }, url: { type: string } } }
        pinned_by: { oneOf: [{ type: string }, { type: "null" }] }
        pinned_at: { oneOf: [{ type: string, format: date-time }, { type: "null" }] }
        issues:
          description: Issues written by key in the body (at most 5) that the caller may browse. Not sent on the stream.
          type: array
          items: { type: object, required: [key, title, status], properties: { key: { type: string }, title: { type: string }, status: { type: string } } }
        reactions:
          type: array
          items: { type: object, required: [emoji, user_ids], properties: { emoji: { type: string }, user_ids: { type: array, items: { type: string } } } }
    Meeting:
      type: object
      additionalProperties: false
      required: [id, title, starts_at, ends_at, organizer_id, attendee_ids, scope, project_key, conversation_id, responses]
      properties:
        id: { type: string }
        title: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        organizer_id: { type: string }
        attendee_ids: { type: array, items: { type: string } }
        scope: { type: string, enum: [people, project, workspace] }
        project_key: { type: [string, "null"] }
        conversation_id: { type: [string, "null"], description: "The chat channel whose huddle the meeting happens in (S76)." }
        responses: { type: object, additionalProperties: { type: string, enum: [going, maybe, declined] }, description: Attendee id → answer (those who answered). }
    FocusSession:
      type: object
      additionalProperties: false
      required: [id, issue_key, user_id, state, planned_minutes, started_at, ended_at, focused_seconds, remaining_seconds, remaining_ms, ends_at, server_time, reason]
      properties:
        id: { type: string }
        issue_key: { type: string }
        user_id: { type: string }
        state: { type: string, enum: [running, paused, completed, interrupted] }
        planned_minutes: { type: integer }
        started_at: { type: string, format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        focused_seconds: { type: integer }
        remaining_seconds: { type: integer }
        remaining_ms: { type: integer, description: Exact time left in milliseconds. }
        ends_at: { type: [string, "null"], format: date-time, description: "Absolute deadline while running (null when paused or ended)." }
        server_time: { type: string, format: date-time, description: Server clock when the response was made; clients use it to correct skew. }
        reason: { type: string, description: "Why it was interrupted: stopped, or meeting: <title>" }
    Workspace:
      type: object
      additionalProperties: false
      required: [id, slug, name, role, url]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        role: { type: string, enum: [owner, admin, member, ""] }
        url: { type: string, description: "https://<slug>.<base domain>/ (\"/\" in single-tenant mode)" }
    ImportReport:
      type: object
      additionalProperties: false
      required: [dry_run, items, errors, skipped]
      properties:
        dry_run: { type: boolean }
        skipped: { type: array, items: { type: string }, description: External keys imported by an earlier run }
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [line, external_key, message]
            properties: { line: { type: integer }, external_key: { type: string }, message: { type: string } }
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [line, external_key, issue_key, title, type, status, priority, assignee_id, points, created_at, resolved_at, warnings]
            properties:
              line: { type: integer }
              external_key: { type: string, example: PROJ-12 }
              issue_key: { type: [string, "null"], description: null in a preview }
              title: { type: string }
              type: { type: string }
              status: { type: string }
              priority: { type: string }
              assignee_id: { type: [string, "null"] }
              points: { type: [number, "null"] }
              created_at: { type: [string, "null"], format: date-time }
              resolved_at: { type: [string, "null"], format: date-time }
              warnings: { type: array, items: { type: string } }
    Error:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string, description: Localized summary of the error code. }
        status: { type: integer }
        detail: { type: string, description: The specific reason for this occurrence. }
        instance: { type: string }
        code: { type: string, description: "Stable Kyber error code, e.g. ISSUE_NOT_FOUND. Branch on this." }
        numeric_code: { type: integer }
    User:
      type: object
      required: [id, email, name]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
    ProjectKey: { type: string, pattern: "^[A-Z][A-Z0-9]{1,9}$" }
    Project:
      type: object
      required: [id, key, name]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        key: { $ref: "#/components/schemas/ProjectKey" }
        name: { type: string }
    ProjectList:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: "#/components/schemas/Project" } } }
    Role: { type: string, enum: [admin, member, viewer] }
    Member:
      type: object
      required: [user_id, email, name, role]
      additionalProperties: false
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    Status:
      type: string
      pattern: "^[a-z0-9_]{1,40}$"
      description: A status id of the project's workflow (default workflow — todo, in_progress, done).
    StatusCategory: { type: string, enum: [todo, in_progress, done] }
    TimeTracking:
      type: object
      required: [original_seconds, remaining_seconds, spent_seconds, original, remaining, spent]
      properties:
        original_seconds: { type: integer }
        remaining_seconds: { type: integer }
        spent_seconds: { type: integer }
        original: { type: string, description: "e.g. 1d 4h; empty when none" }
        remaining: { type: string }
        spent: { type: string }
    Worklog:
      type: object
      required: [id, issue_key, author_id, author_name, started, seconds, spent, comment]
      properties:
        id: { type: string }
        issue_key: { type: string }
        author_id: { type: string }
        author_name: { type: string }
        started: { type: string, format: date-time }
        seconds: { type: integer }
        spent: { type: string }
        comment: { type: string }
    Resolution:
      type: string
      enum: [done, wont_do, duplicate, cannot_reproduce]
    CustomField:
      type: object
      required: [id, project_key, name, type, options, version]
      properties:
        id: { type: string }
        project_key: { type: string }
        name: { type: string }
        type: { type: string, enum: [text, number, date, select] }
        options: { type: array, items: { type: string } }
        version: { type: integer }
    CustomFieldInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        type: { type: string, enum: [text, number, date, select], description: "On create only." }
        options: { type: array, items: { type: string, maxLength: 60 }, maxItems: 100 }
    SearchHit:
      type: object
      required: [key, project_key, title, type, status, status_name, status_category, priority, assignee_id, resolution, points]
      properties:
        key: { type: string }
        project_key: { type: string }
        title: { type: string }
        type: { type: string }
        status: { type: string }
        status_name: { type: string }
        status_category: { type: string }
        priority: { type: string }
        assignee_id: { type: [string, "null"] }
        resolution: { type: string }
        points: { type: [number, "null"] }
    FormQuestion:
      type: object
      required: [label, required, long]
      properties:
        id: { type: string, description: "q1, q2, … in display order (set by the server)." }
        label: { type: string, minLength: 1, maxLength: 120 }
        required: { type: boolean }
        long: { type: boolean, description: A multi-line answer. }
    FormInput:
      type: object
      required: [name, issue_type]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        intro: { type: string, maxLength: 2000 }
        issue_type: { type: string, enum: [story, task, bug] }
        questions: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/FormQuestion" } }
    Form:
      type: object
      required: [id, project_key, name, intro, issue_type, questions, version]
      properties:
        id: { type: string }
        project_key: { type: string }
        name: { type: string }
        intro: { type: string }
        issue_type: { type: string, enum: [story, task, bug] }
        questions: { type: array, items: { $ref: "#/components/schemas/FormQuestion" } }
        version: { type: integer }
    PageInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, maxLength: 100000, description: Markdown. }
    Page:
      type: object
      required: [id, project_key, title, body, author_id, updated_by, updated_at, version]
      properties:
        id: { type: string }
        project_key: { type: string }
        title: { type: string }
        body: { type: string }
        author_id: { type: string }
        updated_by: { type: string }
        updated_at: { type: string, format: date-time }
        version: { type: integer, description: Number of the latest revision. }
    PageRevision:
      type: object
      required: [number, title, body, by, at]
      properties:
        number: { type: integer }
        title: { type: string }
        body: { type: string }
        by: { type: string }
        at: { type: string, format: date-time }
    Attachment:
      type: object
      required: [id, issue_key, name, content_type, size, sha256, uploaded_by, uploaded_at, inline, url]
      properties:
        id: { type: string }
        issue_key: { type: string }
        name: { type: string }
        content_type: { type: string }
        size: { type: integer }
        sha256: { type: string }
        uploaded_by: { type: string }
        uploaded_at: { type: string, format: date-time }
        inline: { type: boolean, description: "Browsers may show it in place (images, PDF)" }
        url: { type: string }
    AdminMember:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [owner, admin, member] }
    AdminProject:
      type: object
      required: [key, name, members]
      properties: { key: { type: string }, name: { type: string }, members: { type: integer } }
    DeadLetter:
      type: object
      required: [id, event, actor_id, at, attempts, last_error]
      properties:
        id: { type: integer }
        event: { type: string }
        actor_id: { type: string }
        at: { type: string, format: date-time }
        attempts: { type: integer }
        last_error: { type: string }
    Announcement:
      type: object
      required: [id, project_key, title, body, author_id, created_at]
      properties:
        id: { type: string }
        project_key: { type: [string, "null"], description: null for a workspace-wide announcement. }
        title: { type: string }
        body: { type: string, description: Markdown. }
        author_id: { type: string }
        created_at: { type: string, format: date-time }
    GoalStatus: { type: string, enum: [on_track, at_risk, off_track, done] }
    GoalInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        target_date: { type: string, description: "YYYY-MM-DD; empty = no target date." }
        jql: { type: string, maxLength: 2000, description: "Issues of the project that measure the goal (no ORDER BY); empty = none." }
    Goal:
      type: object
      required: [id, project_key, owner_id, name, target_date, jql, status, done, total, percent, version]
      properties:
        id: { type: string }
        project_key: { type: string }
        owner_id: { type: string }
        name: { type: string }
        target_date: { type: [string, "null"], format: date }
        jql: { type: string }
        status: { $ref: "#/components/schemas/GoalStatus" }
        done: { type: integer, description: Issues the query finds in a Done status. }
        total: { type: integer, description: Issues the query finds (that the caller may see). }
        percent: { type: integer }
        version: { type: integer }
    Filter:
      type: object
      required: [id, owner_id, name, jql, shared, version, mine]
      properties:
        id: { type: string }
        owner_id: { type: string }
        name: { type: string }
        jql: { type: string }
        shared: { type: boolean }
        version: { type: integer }
        mine: { type: boolean }
    FilterInput:
      type: object
      required: [name, jql]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        jql: { type: string, maxLength: 1000 }
        shared: { type: boolean }
    Version:
      type: object
      required: [id, project_key, name, description, release_date, state, released_at, version]
      properties:
        id: { type: string }
        project_key: { type: string }
        name: { type: string, maxLength: 60 }
        description: { type: string, maxLength: 2000 }
        release_date: { type: [string, "null"], format: date-time }
        state: { type: string, enum: [unreleased, released, archived] }
        released_at: { type: [string, "null"], format: date-time }
        version: { type: integer }
        issues: { type: integer, description: "Issues planned into it (listing only)." }
        done: { type: integer, description: "Of those, in a Done status (listing only)." }
        unresolved: { type: integer, description: "Of those, unresolved (listing only)." }
    VersionInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        description: { type: string, maxLength: 2000 }
        release_date: { type: [string, "null"], format: date-time }
    SprintReportIssue:
      type: object
      required: [key, title, type, points, status_category, added_after_start]
      properties:
        key: { type: string }
        title: { type: string }
        type: { type: string }
        points: { type: number }
        status_category: { type: string }
        added_after_start: { type: boolean }
    PermissionGrants:
      type: object
      required: [permission, grants]
      properties:
        permission:
          type: string
          enum: [BROWSE_PROJECTS, CREATE_ISSUES, EDIT_ISSUES, DELETE_ISSUES, ASSIGN_ISSUES, ASSIGNABLE_USER, TRANSITION_ISSUES,
            CLOSE_ISSUES, ADD_COMMENTS, EDIT_ALL_COMMENTS, DELETE_ALL_COMMENTS, MANAGE_SPRINTS, ADMINISTER_PROJECTS]
        grants:
          type: array
          items:
            type: object
            required: [kind, value]
            properties:
              kind: { type: string, enum: [role, user, reporter, assignee] }
              value: { type: string, description: "Role id (admin, member, viewer) or user id; empty for reporter/assignee." }
    PermissionScheme:
      type: object
      required: [custom, permissions]
      properties:
        custom: { type: boolean }
        permissions: { type: array, items: { $ref: "#/components/schemas/PermissionGrants" } }
    AuditEntry:
      type: object
      additionalProperties: false
      required: [at, actor_id, actor_name, action, target, status]
      properties:
        at: { type: string, format: date-time }
        actor_id: { type: string }
        actor_name: { type: string }
        action: { type: string, description: "The API operation, e.g. PUT /api/v1/projects/{key}/workflow" }
        target: { type: string, description: The concrete path }
        status: { type: integer, description: The HTTP status of the result }
    IssueLink:
      type: object
      additionalProperties: false
      required: [id, type, phrase, issue]
      properties:
        id: { type: string }
        type: { type: string, enum: [blocks, relates, duplicates, clones] }
        phrase: { type: string, description: "Read from the requested issue's side, e.g. 'is blocked by'" }
        issue: { $ref: "#/components/schemas/Issue" }
    NotificationSettings:
      type: object
      additionalProperties: false
      required: [email, telegram, email_available, telegram_available, telegram_connected]
      properties:
        email: { type: boolean }
        telegram: { type: boolean }
        email_available: { type: boolean, description: SMTP is configured on this server }
        telegram_available: { type: boolean, description: A Telegram bot is configured on this server }
        telegram_connected: { type: boolean, description: The user connected their Telegram chat }
    HistoryEntry:
      type: object
      additionalProperties: false
      required: [at, by_id, by_name, field, from, to, from_name, to_name]
      properties:
        at: { type: string, format: date-time }
        by_id: { type: [string, "null"], description: "null = the system or unknown (recovered history)" }
        by_name: { type: string }
        field:
          type: string
          description: "created, comment, imported, link, or a field: title, description, type, status, priority, assignee, estimate, sprint, rank, parent"
        from: { type: string }
        to: { type: string }
        from_name: { type: string, description: "Display value (people's names for assignee)" }
        to_name: { type: string }
    BoardColumn:
      type: object
      description: A column shows the issues in its statuses. `min`/`max` are WIP limits (0 = none).
      required: [name, statuses]
      properties:
        name: { type: string, maxLength: 60 }
        statuses: { type: array, items: { $ref: "#/components/schemas/Status" } }
        min: { type: integer, minimum: 0 }
        max: { type: integer, minimum: 0 }
    BoardInput:
      type: object
      required: [name, kind]
      properties:
        name: { type: string, maxLength: 60 }
        kind: { type: string, enum: [scrum, kanban] }
        columns: { type: array, items: { $ref: "#/components/schemas/BoardColumn" } }
        kanban_backlog: { type: boolean, description: "Kanban boards with 2+ columns: list the first column's issues in a backlog instead of on the board." }
    Board:
      type: object
      required: [id, project_key, name, kind, columns, version, kanban_backlog]
      properties:
        id: { type: string }
        project_key: { type: string }
        name: { type: string }
        kind: { type: string, enum: [scrum, kanban] }
        columns: { type: array, items: { $ref: "#/components/schemas/BoardColumn" } }
        version: { type: integer }
        kanban_backlog: { type: boolean }
    WorkflowStatus:
      type: object
      required: [id, name, category]
      properties:
        id: { $ref: "#/components/schemas/Status" }
        name: { type: string, maxLength: 60 }
        category: { $ref: "#/components/schemas/StatusCategory" }
    Workflow:
      type: object
      description: Statuses in board-column order. No transitions means every status can reach every other one.
      required: [initial, statuses, transitions]
      properties:
        initial: { $ref: "#/components/schemas/Status" }
        statuses: { type: array, items: { $ref: "#/components/schemas/WorkflowStatus" } }
        transitions:
          type: array
          items:
            type: object
            required: [from, to]
            properties: { from: { $ref: "#/components/schemas/Status" }, to: { $ref: "#/components/schemas/Status" } }
    IssueType: { type: string, enum: [epic, story, task, bug, subtask] }
    Priority: { type: string, enum: [lowest, low, medium, high, highest] }
    Issue:
      type: object
      required: [id, key, title, type, status, description, priority, assignee_id, reporter_id, sprint_id, estimate, rank, parent_key, security_level, resolution, fix_versions, time_tracking, custom_fields, version]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        key: { type: string, pattern: "^[A-Z][A-Z0-9]{1,9}-[1-9][0-9]*$" }
        title: { type: string, minLength: 1 }
        type: { $ref: "#/components/schemas/IssueType" }
        status: { $ref: "#/components/schemas/Status" }
        description: { type: string }
        priority: { $ref: "#/components/schemas/Priority" }
        assignee_id: { type: [string, "null"], format: uuid }
        reporter_id: { type: [string, "null"], format: uuid, description: Creator; null for issues created before 0.6. }
        estimate: { type: [number, "null"], minimum: 0, maximum: 999, description: Story points (one decimal). }
        sprint_id: { type: [string, "null"], format: uuid }
        rank: { type: string, description: Fractional backlog rank; compare byte-wise. }
        parent_key: { type: [string, "null"], description: "The epic of a story/task/bug, or the issue a sub-task belongs to." }
        fix_versions: { type: array, items: { type: string }, description: "Ids of the versions (releases) the issue is planned to ship in." }
        time_tracking: { $ref: "#/components/schemas/TimeTracking" }
        custom_fields: { type: object, additionalProperties: { type: string }, description: "Custom field values by field id (show those of the project's current fields)." }
        resolution:
          description: How a resolved issue ended; "" while it is not in a Done status.
          type: string
          enum: ["", done, wont_do, duplicate, cannot_reproduce]
        start_date: { type: [string, "null"], format: date, description: Planned start (the timeline). }
        due_date: { type: [string, "null"], format: date }
        security_level:
          type: string
          enum: ["", confidential]
          description: "Issue security (ADR-0003). confidential = only project admins, the reporter and the assignee can see it; it is hidden (404) from everyone else and left out of every list, report, export and notification."
        version: { type: integer, minimum: 1 }
    Sprint:
      type: object
      required: [id, project_key, name, goal, state, started_at, ends_at, completed_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        project_key: { $ref: "#/components/schemas/ProjectKey" }
        name: { type: string, minLength: 1 }
        goal: { type: string }
        state: { type: string, enum: [planned, active, closed] }
        started_at: { type: [string, "null"], format: date-time }
        ends_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
    Bucket:
      type: object
      additionalProperties: false
      required: [key, count, points]
      properties:
        key: { type: string }
        count: { type: integer }
        points: { type: number }
    BurndownSample:
      type: object
      additionalProperties: false
      required: [at, remaining_points, remaining_issues]
      properties:
        at: { type: string, format: date-time }
        remaining_points: { type: number }
        remaining_issues: { type: integer }
    Notification:
      type: object
      required: [id, kind, issue_key, issue_title, project_key, conversation_id, conversation_name, actor_name, excerpt, read, created_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [assigned, commented, mentioned, transitioned, announcement, meeting, reminder, message], description: "message: a message in a conversation you follow (level all; conversation_id, excerpt). reminder: a saved chat message's reminder (conversation_id, excerpt). meeting: a meeting you are invited to was scheduled or cancelled, or starts soon (excerpt: when). transitioned: the status of an issue you report, are assigned or watch changed (excerpt: From → To). announcement: news to a project (project_key) or the workspace (project_key empty); issue_key is empty and issue_title holds its title." }
        issue_key: { type: string }
        issue_title: { type: string }
        project_key: { type: string, description: The announced project; empty for issue notifications and workspace announcements. }
        conversation_id: { type: string, description: "Set (and issue_key empty) for a mention in chat." }
        conversation_name: { type: string, description: "The channel of a chat mention; empty for a direct message." }
        actor_name: { type: string }
        excerpt: { type: string, description: Start of the comment (commented/mentioned). }
        read: { type: boolean }
        created_at: { type: string, format: date-time }
    IssueList:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: "#/components/schemas/Issue" } } }
    Comment:
      type: object
      required: [id, author_id, author_name, body, created_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        author_id: { type: string, format: uuid }
        author_name: { type: string }
        body: { type: string, minLength: 1 }
        created_at: { type: string, format: date-time }
