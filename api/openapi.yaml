openapi: 3.1.0
info:
  title: Kyber API
  version: 0.56.0
  description: |
    Self-hosted issue & project tracker. Authenticate with the `kyber_session` cookie (browsers)
    or `Authorization: Bearer <token>` (API clients). Cookie-authenticated writes must send
    `Content-Type: application/json` (CSRF guard). Non-members receive `404` for project resources.
  license: { name: MIT, identifier: MIT }
servers:
  - url: http://localhost:8080
security:
  - bearer: []
  - cookie: []

paths:
  /healthz:
    get:
      operationId: healthz
      security: []
      responses:
        "200": { $ref: "#/components/responses/Status" }
  /readyz:
    get:
      operationId: readyz
      security: []
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "503": { $ref: "#/components/responses/Status" }
  /metrics:
    get:
      operationId: metrics
      security: []
      responses:
        "200":
          description: Prometheus text exposition format.
          content:
            text/plain: { schema: { type: string } }

  /api/v1/auth/signup:
    post:
      operationId: signup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, password]
              properties:
                email: { type: string }
                name: { type: string }
                password: { type: string, minLength: 10, maxLength: 128 }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Logged in; also sets the `kyber_session` cookie.
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties: { token: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429":
          description: Too many failed attempts for this email and IP.
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds until the next attempt is allowed. }
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/auth/providers:
    get:
      operationId: authProviders
      security: []
      description: Which social sign-in methods this installation has configured.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [google, telegram_bot, telegram_otp]
                properties:
                  google: { type: boolean }
                  telegram_bot: { type: [string, "null"], description: Bot username for the Telegram Login Widget; null when disabled. }
                  telegram_otp: { type: boolean, description: The bot sends one-time login codes. }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/auth/google/start:
    get:
      operationId: googleStart
      security: []
      description: >-
        Starts "Sign in with Google" (OpenID Connect code flow with PKCE). Sets a short-lived HttpOnly
        `kyber_oauth` cookie holding state, nonce and PKCE verifier, then redirects to Google.
      responses:
        "302": { description: "Redirect to the Google consent screen" }
        "404": { description: Google sign-in is not configured }
  /api/v1/auth/google/callback:
    get:
      operationId: googleCallback
      security: []
      description: >-
        Google redirects here. The `state` must match this browser's `kyber_oauth` cookie; the ID token's
        signature, issuer, audience, expiry and nonce are verified. A verified email links to an existing
        account; an unverified one never does. On success sets `kyber_session` and redirects to `/`;
        on failure redirects to `/login?error=google_failed` or `google_email_taken`.
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        "302": { description: "Redirect to / when signed in, otherwise to /login?error=google_failed or google_email_taken" }
        "404": { description: Google sign-in is not configured }
  /api/v1/auth/telegram:
    post:
      operationId: telegramLogin
      security: []
      description: >-
        Signs in with the Telegram Login Widget payload (passed through unchanged). The HMAC-SHA256 of the
        fields is checked with the bot token and `auth_date` must be at most 24 h old. Answers like `login`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, auth_date, hash]
              properties:
                id: { type: integer }
                first_name: { type: string }
                last_name: { type: string }
                username: { type: string }
                photo_url: { type: string }
                auth_date: { type: integer }
                hash: { type: string }
      responses:
        "200":
          description: Logged in; also sets the `kyber_session` cookie.
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties: { token: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/auth/telegram/otp:
    post:
      operationId: telegramOtpStart
      security: []
      description: >-
        Starts "log in with a Telegram code". Open `link` (a t.me deep link) and press Start: the bot sends a
        6-digit code valid for 5 minutes. Throttled per client IP.
      responses:
        "201":
          description: Challenge created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, link, expires_at]
                properties:
                  id: { type: string, description: Keep it in the browser; needed to verify the code. }
                  link: { type: string, example: "https://t.me/kyber_bot?start=AbC123" }
                  expires_at: { type: string, format: date-time }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429":
          description: Too many code requests from this IP.
          headers:
            Retry-After: { schema: { type: integer } }
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Error" } } }
  /api/v1/auth/telegram/otp/verify:
    post:
      operationId: telegramOtpVerify
      security: []
      description: Checks the code from the bot (5 attempts, single use) and signs in like `login`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, code]
              properties: { id: { type: string }, code: { type: string, example: "123456" } }
      responses:
        "200":
          description: Logged in; also sets the `kyber_session` cookie.
          content:
            application/json:
              schema: { type: object, required: [token], properties: { token: { type: string } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        "204": { description: Session ended. }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/me:
    get:
      operationId: me
      responses:
        "200": { description: Current user, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "401": { $ref: "#/components/responses/Error" }

        "404": { $ref: "#/components/responses/Error" }
  /api/v1/issues/{key}/attachments:
    parameters: [{ name: key, in: path, required: true, schema: { type: string } }]
    get:
      operationId: listAttachments
      description: The issue's files, oldest first (needs browse on the issue).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Attachment" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: uploadAttachment
      description: Attach a file (multipart field "file", at most 25 MiB; needs edit on the issue). The name is reduced to a safe base name.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/Attachment" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/attachments/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      operationId: downloadAttachment
      description: >-
        The file. Images and PDFs render inline unless ?download is given; every other type is served as an attachment
        with nosniff and a sandboxing Content-Security-Policy.
      parameters: [{ name: download, in: query, required: false, schema: { type: string }, allowEmptyValue: true }]
      responses:
        "200":
          description: File contents
          content: { "*/*": { schema: { type: string, format: binary } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAttachment
      description: Remove a file (its uploader, or a project administrator).
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/mcp:
    post:
      operationId: mcp
      description: >-
        Model Context Protocol endpoint (Streamable HTTP, JSON responses; ADR-0009). One JSON-RPC 2.0 message per request
        (initialize, ping, tools/list, tools/call); notifications are acknowledged with 202. Tools - list_projects,
        search_issues, get_issue, create_issue, add_comment - run with the caller's permissions.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [jsonrpc, method], properties: { jsonrpc: { type: string, enum: ["2.0"] }, id: {}, method: { type: string }, params: { type: object } } } } }
      responses:
        "200":
          description: JSON-RPC response (protocol errors are reported in its error member)
          content: { application/json: { schema: { type: object, required: [jsonrpc, id], properties: { jsonrpc: { type: string }, id: {}, result: {}, error: { type: object } } } } }
        "202": { description: Notification accepted }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/admin/access:
    get:
      operationId: adminAccess
      description: Whether the caller administers this workspace (owners/admins; KYBER_ADMIN_EMAILS in single-tenant mode).
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, required: [admin], properties: { admin: { type: boolean } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/admin/members:
    get:
      operationId: adminMembers
      description: The workspace's people and roles (single-tenant mode - everyone in a project).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/AdminMember" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/admin/members/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    put:
      operationId: adminChangeRole
      description: Changes a member's workspace role; the last owner stays. Not available in single-tenant mode (409).
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [role], properties: { role: { type: string, enum: [owner, admin, member] } } } } }
      responses:
        "204": { description: Changed }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/admin/projects:
    get:
      operationId: adminProjects
      description: Every project of the workspace with its member count.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/AdminProject" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/admin/dead-letters:
    get:
      operationId: adminDeadLetters
      description: The workspace's events whose handlers kept failing (ADR-0007), oldest first.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/DeadLetter" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/admin/dead-letters/{id}/retry:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      operationId: adminRetryDeadLetter
      description: Queues a dead letter again once its handler is fixed.
      responses:
        "204": { description: Queued }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/meetings:
    get:
      operationId: listMeetings
      description: The caller's meetings in this workspace (the time table). Defaults to today and the next 7 days (UTC).
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Meeting" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      operationId: scheduleMeeting
      description: |
        Books a meeting; the organizer always attends. During a meeting its attendees cannot run a Pomodoro.
        scope "project" (with project_key; project members with write access) or "workspace" (workspace owners/admins,
        KYBER_ADMIN_EMAILS in single-tenant mode) invites every member. Everyone invited is notified, and reminded 15 minutes
        before the start.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, starts_at, ends_at]
              properties:
                title: { type: string }
                starts_at: { type: string, format: date-time }
                ends_at: { type: string, format: date-time }
                attendee_ids: { type: array, items: { type: string } }
                scope: { type: string, enum: ["", people, project, workspace] }
                project_key: { type: string }
                conversation_id: { type: string, description: "Optional: a channel the organizer may read; the meeting happens in its huddle (S76)." }
      responses:
        "201": { description: Scheduled, content: { application/json: { schema: { $ref: "#/components/schemas/Meeting" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/meetings/{id}:
    delete:
      operationId: cancelMeeting
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Cancelled }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/meetings/{id}/response:
    put:
      operationId: respondToMeeting
      description: An attendee answers the invitation.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [response], properties: { response: { type: string, enum: [going, maybe, declined] } } }
      responses:
        "200": { description: Answered, content: { application/json: { schema: { $ref: "#/components/schemas/Meeting" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/conversations:
    get:
      operationId: listConversations
      description: Public channels of this workspace and every channel or DM the caller belongs to, with unread counts.
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Conversation" } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/channels:
    post:
      operationId: createChannel
      description: Creates a channel (name `[a-z0-9_-]{1,80}`, unique per workspace); the creator joins it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: { name: { type: string }, topic: { type: string }, private: { type: boolean } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Conversation" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/dms:
    post:
      operationId: openDM
      description: Opens the direct message between the caller and 1–7 workspace members (the same people get the same DM).
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [user_ids], properties: { user_ids: { type: array, items: { type: string } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Conversation" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/conversations/{id}:
    get:
      operationId: getConversation
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Conversation" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: renameChannel
      description: Owner or admins rename a channel and set its topic (S69).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string }, topic: { type: string } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Conversation" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/conversations/{id}/join:
    post:
      operationId: joinConversation
      description: Joins a public channel.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Joined }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/conversations/{id}/leave:
    post:
      operationId: leaveConversation
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Left }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/conversations/{id}/members:
    post:
      operationId: inviteToConversation
      description: A member adds a workspace member to a channel (the only way into a private one).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [user_id], properties: { user_id: { type: string } } }
      responses:
        "204": { description: Invited }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/stream:
    get:
      operationId: openStream
      description: |
        Server-Sent Events of this workspace for the caller (`message.posted`, `message.edited`,
        `message.deleted`, `message.reacted`, `message.pinned`, `typing`, `conversation.read` (DMs: who read up to when), `conversation.updated` (a channel was renamed, archived or its members changed), `call.updated`, `call.signal`, `call.follow`, `call.reaction` (an emoji from a participant, not stored), `whiteboard.ops`, `whiteboard.cursor`; each `data:` is JSON). Send `Last-Event-ID` on reconnect to receive
        what was missed. Keeping the stream open marks the caller online.
      parameters:
        - { name: Last-Event-ID, in: header, schema: { type: string } }
      responses:
        "200": { description: Event stream, content: { text/event-stream: { schema: { type: string } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/presence:
    get:
      operationId: getPresence
      description: Which of the given users have Kyber open in this workspace.
      parameters:
        - { name: user_id, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [online], properties: { online: { type: array, items: { type: string } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/conversations/{id}/typing:
    post:
      operationId: sendTyping
      description: Tells the other members that the caller is typing (not stored).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Sent }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/conversations/{id}/read:
    post:
      operationId: markConversationRead
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Marked read }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/conversations/{id}/messages:
    get:
      operationId: listMessages
      description: History, newest first. Page with `before` (a message id of this conversation).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: before, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Message" } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      operationId: postMessage
      description: Posts a message (1–4000 characters); only members post — join a public channel first.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { $ref: "#/components/requestBodies/MessageBody" }
      responses:
        "201": { description: Posted, content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/messages/{id}/replies:
    get:
      operationId: listReplies
      description: The thread of a top-level message, oldest first.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Message" } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: replyToMessage
      description: Replies in the thread of a top-level message (members only).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { $ref: "#/components/requestBodies/MessageBody" }
      responses:
        "201": { description: Posted, content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/messages/{id}/reactions:
    post:
      operationId: toggleReaction
      description: Toggles the caller's emoji reaction (members only).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [emoji], properties: { emoji: { type: string } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/messages/{id}:
    patch:
      operationId: editMessage
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { $ref: "#/components/requestBodies/MessageBody" }
      responses:
        "200": { description: Edited, content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMessage
      description: The author deletes a message; it stays in history as deleted.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/conversations/{id}/call:
    get:
      operationId: getLiveCall
      description: The conversation's live huddle, or null.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [call], properties: { call: { oneOf: [{ $ref: "#/components/schemas/Call" }, { type: "null" }] } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: joinCall
      description: |
        Starts the conversation's huddle, or joins the live one (members only; at most 6 people; the microphone
        starts on). Members hear `call.updated` on the stream whenever the call changes.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: In the call, content: { application/json: { schema: { $ref: "#/components/schemas/Call" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/calls/{id}/leave:
    post:
      operationId: leaveCall
      description: Leaves the call; it ends with its last participant.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Left }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/calls/{id}/media:
    put:
      operationId: setCallMedia
      description: What the caller sends (microphone, camera, screen). Starting a screen share stops anyone else's.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { audio: { type: boolean }, video: { type: boolean }, screen: { type: boolean } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Call" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/calls/{id}/signal:
    post:
      operationId: sendCallSignal
      description: |
        Relays WebRTC signaling (an SDP offer/answer or an ICE candidate, opaque to the server, at most 64 KB) to
        another participant of the call, who receives it as `call.signal` on the stream. Never stored.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, kind, data]
              properties: { to: { type: string }, kind: { type: string, enum: [offer, answer, candidate] }, data: { type: string } }
      responses:
        "204": { description: Relayed }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/calls/ice:
    get:
      operationId: getIceServers
      description: STUN/TURN servers for RTCPeerConnection; TURN comes with credentials valid for 12 hours.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ice_servers]
                properties:
                  ice_servers:
                    type: array
                    items:
                      type: object
                      required: [urls]
                      properties: { urls: { type: array, items: { type: string } }, username: { type: string }, credential: { type: string } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/conversations/{id}/whiteboards:
    get:
      operationId: listWhiteboards
      description: The conversation's whiteboards, newest first (members only).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Whiteboard" } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createWhiteboard
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [title], properties: { title: { type: string } } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Whiteboard" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/whiteboards/{id}:
    get:
      operationId: getWhiteboard
      description: The whiteboard with all its elements, in drawing order.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Whiteboard" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/whiteboards/{id}/ops:
    post:
      operationId: applyWhiteboardOps
      description: |
        Adds, updates or deletes elements (at most 200 per request). Updates and deletes name the version they
        were made on; each op applies or fails on its own (error stale, not_found, exists, full or invalid) and
        returns the element's current state. Applied changes reach the members as `whiteboard.ops`.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ops]
              properties:
                ops:
                  type: array
                  items: { type: object, required: [op, element], properties: { op: { type: string, enum: [add, update, delete] }, element: { $ref: "#/components/schemas/WhiteboardElement" } } }
      responses:
        "200":
          description: Results, in op order
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [applied, error, element]
                      properties:
                        applied: { type: boolean }
                        error: { type: string, enum: ["", stale, not_found, exists, full, invalid] }
                        element: { $ref: "#/components/schemas/WhiteboardElement" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/whiteboards/{id}/cursor:
    post:
      operationId: shareWhiteboardCursor
      description: Shows the caller's pointer to the other members (`whiteboard.cursor`; not stored).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [x, y], properties: { x: { type: number }, y: { type: number } } } } }
      responses:
        "204": { description: Shared }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/calls/{id}/presentation:
    put:
      operationId: presentToCall
      description: Opens a doc or whiteboard for everyone in the call (replacing the current presentation). Each viewer opens it with their own permissions.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [kind, ref], properties: { kind: { type: string, enum: [doc, whiteboard] }, ref: { type: string } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Call" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: stopPresenting
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Call" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/calls/{id}/presentation/follow:
    post:
      operationId: followPresenter
      description: The presenter's view (scroll position as fractions, and zoom) for the others, as `call.follow`; not stored.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [x, y, zoom], properties: { x: { type: number }, y: { type: number }, zoom: { type: number } } } } }
      responses:
        "204": { description: Sent }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/calls/{id}/recording:
    put:
      operationId: startRecording
      description: Starts recording the call (one recorder at a time); everyone sees `recording` on the call.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Call" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: stopRecording
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Call" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/calls/{id}/hand:
    put:
      operationId: raiseHand
      description: Raises or lowers my hand in the huddle (S75).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [raised], properties: { raised: { type: boolean } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Call" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/calls/{id}/reactions:
    post:
      operationId: reactInCall
      description: Shows an emoji to the others in the huddle as `call.reaction` (not stored).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [emoji], properties: { emoji: { type: string } } } } }
      responses:
        "204": { description: Sent }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/messages/{id}/save:
    put:
      operationId: saveMessage
      description: Saves a message for later (S65), optionally with a reminder time in the future; saving again replaces it.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { remind_at: { type: [string, "null"], format: date-time } } } } }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { type: object, required: [saved_at, remind_at], properties: { saved_at: { type: string, format: date-time }, remind_at: { type: [string, "null"], format: date-time } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: unsaveMessage
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Forgotten }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/me/status:
    put:
      operationId: setStatus
      description: |
        My status in the workspace (S66): an emoji and up to 100 characters until expires_at, and Do Not Disturb
        until dnd_until (chat mentions then stay in the inbox, without email or Telegram; a running Pomodoro does
        the same). Empty emoji and text clear the status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                emoji: { type: string }
                text: { type: string }
                expires_at: { type: [string, "null"], format: date-time }
                dnd_until: { type: [string, "null"], format: date-time }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UserStatus" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/chat/statuses:
    get:
      operationId: listStatuses
      description: The current statuses of the given people in the workspace (people without one are left out).
      parameters:
        - { name: user_id, in: query, schema: { type: array, items: { type: string }, maxItems: 200 }, style: form, explode: true }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/UserStatus" } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/conversations/{id}/scheduled:
    post:
      operationId: scheduleMessage
      description: Schedules a message (members only) to be posted at send_at (1 minute to 120 days ahead); only I see it before.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ScheduleInput" } } } }
      responses:
        "201": { description: Scheduled, content: { application/json: { schema: { $ref: "#/components/schemas/ScheduledMessage" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/chat/scheduled:
    get:
      operationId: listScheduledMessages
      description: My scheduled messages, soonest first.
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/ScheduledMessage" } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/scheduled/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    patch:
      operationId: rescheduleMessage
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ScheduleInput" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ScheduledMessage" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: cancelScheduledMessage
      responses:
        "204": { description: Cancelled }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/conversations/{id}/reminders:
    post:
      operationId: remindMe
      description: A personal reminder (/remind me), told to me as a notification of kind reminder at `at`.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [text, at], properties: { text: { type: string }, at: { type: string, format: date-time } } } } }
      responses:
        "201":
          description: Set
          content: { application/json: { schema: { type: object, required: [id, text, at], properties: { id: { type: string }, text: { type: string }, at: { type: string, format: date-time } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/conversations/{id}/receipts:
    get:
      operationId: readReceipts
      description: How far each member of a DM has read it (S68), for "Seen"; empty for channels.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { type: object, required: [user_id, read_at], properties: { user_id: { type: string }, read_at: { type: string, format: date-time } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/conversations/{id}/archive:
    post:
      operationId: archiveChannel
      description: Owner or admins make the channel read-only (S69).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Conversation" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/conversations/{id}/unarchive:
    post:
      operationId: unarchiveChannel
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Conversation" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/conversations/{id}/admins/{user}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: user, in: path, required: true, schema: { type: string } }
    put:
      operationId: makeChannelAdmin
      description: The owner lets a member manage the channel.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Conversation" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeChannelAdmin
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Conversation" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/conversations/{id}/project:
    put:
      operationId: linkChannelProject
      description: |
        Owner or admins who may browse the project post its news here (S73): issues created and moved, sprints
        started and completed, as system messages naming issues by key only. An empty project_key unlinks.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [project_key], properties: { project_key: { type: string } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Conversation" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/conversations/{id}/members/{user}:
    delete:
      operationId: removeChannelMember
      description: Owner or admins take someone (not the owner) out of the channel.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: user, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Conversation" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/groups:
    get:
      operationId: listGroups
      description: The workspace's user groups (S70); mentioning @handle in chat notifies their members.
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/UserGroup" } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      operationId: createGroup
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/GroupInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/UserGroup" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/groups/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    patch:
      operationId: updateGroup
      description: Anyone in the workspace renames a group or changes its members.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/GroupInput" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UserGroup" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteGroup
      description: Only whoever made the group.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/conversations/{id}/prefs:
    put:
      operationId: setConversationPrefs
      description: |
        My settings for a conversation (S71): level all (a notification for every message), mentions (default) or
        muted (nothing), and my sidebar section ("" for the default lists).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { level: { type: string, enum: [all, mentions, muted] }, section: { type: string, maxLength: 40 } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ConversationPrefs" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/chat/prefs:
    get:
      operationId: listConversationPrefs
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/ConversationPrefs" } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/chat/saved:
    get:
      operationId: listSavedMessages
      description: My saved messages (still readable), most recently saved first.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [message, saved_at, remind_at, reminded]
                      properties:
                        message: { $ref: "#/components/schemas/Message" }
                        saved_at: { type: string, format: date-time }
                        remind_at: { type: [string, "null"], format: date-time }
                        reminded: { type: boolean }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/messages/{id}/pin:
    post:
      operationId: pinMessage
      description: Pins a message for everyone in the conversation (members only); members hear `message.pinned`.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Pinned, content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: unpinMessage
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Unpinned, content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/conversations/{id}/pins:
    get:
      operationId: listPinnedMessages
      description: The conversation's pinned messages, most recently pinned first.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Message" } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/chat/search:
    get:
      operationId: searchMessages
      description: Messages containing every word of q (case-insensitive, at least 2 characters) in the conversations the caller may read, newest first (at most 50).
      parameters: [{ name: q, in: query, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Message" } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/conversations/{id}/files:
    post:
      operationId: uploadFile
      description: |
        Posts a file (the request body, at most 25 MB) to the conversation (members only). Its type is detected
        from the content. Cookie sessions must send `X-Kyber-Request: 1` (CSRF guard).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: name, in: query, required: true, schema: { type: string } }
        - { name: recording, in: query, description: "1 posts the huddle recording (WebM, at most 1 GB) of the caller's recording.", schema: { type: string, enum: ["1"] } }
        - { name: X-Kyber-Request, in: header, schema: { type: string, enum: ["1"] } }
      requestBody:
        required: true
        content: { application/octet-stream: { schema: { type: string, format: binary } } }
      responses:
        "201": { description: Posted, content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/messages/{id}/file:
    get:
      operationId: downloadFile
      description: |
        The message's file, for people who may read the conversation. Images, video, audio and PDF are shown
        inline; everything else is downloaded. Served with nosniff and a sandboxing CSP.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: The file, content: { "*/*": { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/focus:
    get:
      operationId: currentFocus
      description: The caller's running or paused Pomodoro (settled first; null when none).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties: { session: { oneOf: [{ $ref: "#/components/schemas/FocusSession" }, { type: "null" }] } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: startFocus
      description: >-
        Starts a Pomodoro (15-60 minutes, default 25) on an issue. Refused with 409 FOCUS_MEETING_CONFLICT when one of
        the caller's meetings falls inside it; a meeting that begins later ends the session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issue_key]
              properties: { issue_key: { type: string }, minutes: { type: integer, minimum: 15, maximum: 60, default: 25 } }
      responses:
        "201": { description: Started, content: { application/json: { schema: { $ref: "#/components/schemas/FocusSession" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/focus/pause:
    post:
      operationId: pauseFocus
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/FocusSession" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/focus/resume:
    post:
      operationId: resumeFocus
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/FocusSession" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/focus/stop:
    post:
      operationId: stopFocus
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/FocusSession" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/issues/{issueKey}/focus:
    parameters: [{ $ref: "#/components/parameters/IssueKey" }]
    get:
      operationId: issueFocusLog
      description: The issue's Pomodoro history (work log) in this workspace and the total focus time.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total_focused_seconds]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/FocusSession" } }
                  total_focused_seconds: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/workspaces:
    get:
      operationId: listWorkspaces
      description: The caller's workspaces (ADR-0004). Served on the apex domain and on workspace subdomains.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: { items: { type: array, items: { $ref: "#/components/schemas/Workspace" } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createWorkspace
      description: Creates a workspace (its subdomain is `slug`); the caller becomes its owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name]
              properties: { slug: { type: string, example: acme }, name: { type: string } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Workspace" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/projects:
    get:
      operationId: listProjects
      description: Projects the caller is a member of.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectList" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, name]
              properties:
                key: { $ref: "#/components/schemas/ProjectKey" }
                name: { type: string }
      responses:
        "201": { description: Created; the caller becomes admin., content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{key}:
    parameters: [{ $ref: "#/components/parameters/ProjectKey" }]
    get:
      operationId: getProject
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{key}/members:
    parameters: [{ $ref: "#/components/parameters/ProjectKey" }]
    get:
      operationId: listMembers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: { items: { type: array, items: { $ref: "#/components/schemas/Member" } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: setMember
      description: Add a user by email or change their role (admin only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "204": { description: Membership saved. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{key}/workflow:
    parameters: [{ $ref: "#/components/parameters/ProjectKey" }]
    get:
      operationId: getWorkflow
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Workflow" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: setWorkflow
      description: Replace the project's workflow (project admins). A status still holding issues cannot be removed (409).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Workflow" } } }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/Workflow" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{key}/boards:
    parameters: [{ $ref: "#/components/parameters/ProjectKey" }]
    get:
      operationId: listBoards
      description: The project's boards by name. A project gets a Kanban board (one column per status) on first use.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: { items: { type: array, items: { $ref: "#/components/schemas/Board" } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createBoard
      description: Create a board (project admins). Without columns, one column per workflow status.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BoardInput" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Board" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/boards/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getBoard
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Board" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: updateBoard
      description: Reconfigure a board (project admins); `version` must match (optimistic locking).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/BoardInput" }
                - { type: object, required: [version], properties: { version: { type: integer } } }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/Board" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteBoard
      description: Delete a board (project admins). The last board of a project cannot be deleted (409).
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{key}/audit:
    parameters: [{ $ref: "#/components/parameters/ProjectKey" }]
    get:
      operationId: projectAudit
      description: |
        The project's audit log (project admins): every write made through the API by a signed-in user —
        operation, path, result status, who and when — newest first, including refused attempts.
        Request bodies are never stored.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 200 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: { items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{key}/permissions:
    parameters: [{ $ref: "#/components/parameters/ProjectKey" }]
    get:
      operationId: projectPermissions
      description: |
        The project's permission scheme (project admins): every permission with its holders — a project
        role, a user, the issue's reporter or its assignee. `custom` is false while the project uses the default.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PermissionScheme" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: setProjectPermissions
      description: |
        Gives the project its own scheme (project admins). Permissions left out have no holders. The admin
        role must keep BROWSE_PROJECTS and ADMINISTER_PROJECTS (422 otherwise), so admins cannot be locked out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties: { permissions: { type: array, items: { $ref: "#/components/schemas/PermissionGrants" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PermissionScheme" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: resetProjectPermissions
      description: Returns the project to the default scheme (project admins).
      responses:
        "204": { description: Reset }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{key}/telegram-groups/link:
    parameters: [{ $ref: "#/components/parameters/ProjectKey" }]
    post:
      operationId: telegramGroupLink
      description: |
        Project admins: a one-time t.me/<bot>?startgroup=… link (10 minutes). Choosing a group adds the bot,
        which then posts the project's new issues, status changes and sprint starts/completions there.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [url, expires_at]
                properties:
                  url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{key}/telegram-groups:
    parameters: [{ $ref: "#/components/parameters/ProjectKey" }]
    get:
      operationId: telegramGroups
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [chat_id, title, linked_at]
                      properties:
                        chat_id: { type: string }
                        title: { type: string }
                        linked_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{key}/telegram-groups/{chat}:
    parameters:
      - { $ref: "#/components/parameters/ProjectKey" }
      - { name: chat, in: path, required: true, schema: { type: string } }
    delete:
      operationId: unlinkTelegramGroup
      responses:
        "204": { description: Disconnected }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{key}/issues:
    parameters: [{ $ref: "#/components/parameters/ProjectKey" }]
    get:
      operationId: listIssues
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/Status" } }
        - name: sprint
          in: query
          description: A sprint id, or `backlog` for issues in no sprint.
          schema: { type: string }
        - { name: fix_version, in: query, description: "Issues planned into this version.", schema: { type: string } }
      responses:
        "200": { description: Ordered by backlog rank., content: { application/json: { schema: { $ref: "#/components/schemas/IssueList" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createIssue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, type]
              properties:
                title: { type: string }
                type: { $ref: "#/components/schemas/IssueType" }
                parent_key: { type: string, description: "Epic for a story/task/bug; required for a sub-task (its story/task/bug)." }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Issue" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/issues/{issueKey}:
    parameters: [{ $ref: "#/components/parameters/IssueKey" }]
    get:
      operationId: getIssue
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Issue" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: editIssue
      description: Partial update guarded by optimistic locking. `assignee_id` null unassigns; omitted fields are unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer }
                title: { type: string }
                description: { type: string, maxLength: 20000 }
                priority: { $ref: "#/components/schemas/Priority" }
                assignee_id: { type: [string, "null"], format: uuid }
                sprint_id: { type: [string, "null"], description: "A planned or active sprint of the project; null = backlog." }
                estimate: { type: [number, "null"], minimum: 0, maximum: 999, description: "Story points, one decimal; null clears." }
                parent_key: { type: [string, "null"], description: "Move under this epic/issue; null removes the parent (not for sub-tasks)." }
                resolution: { $ref: "#/components/schemas/Resolution" }
                fix_versions: { type: array, items: { type: string }, description: "Replaces the fix versions (unarchived versions of the project)." }
                original_estimate: { type: string, description: "Jira-style duration (1w 2d 3h 30m; 1d = 8h, 1w = 5d); empty clears. While nothing is logged the remaining estimate follows it." }
                remaining_estimate: { type: string, description: "Jira-style duration; empty sets zero." }
                custom_fields: { type: object, additionalProperties: { type: string }, description: "Field id → value (number, YYYY-MM-DD date, one of a select field's options, or text); empty clears." }
                security_level: { type: string, enum: ["", confidential] }
                start_date: { type: string, description: "Planned start, YYYY-MM-DD; empty clears. Must not be after the due date." }
                due_date: { type: string, description: "Due date, YYYY-MM-DD; empty clears." }
      responses:
        "200": { description: Updated issue, content: { application/json: { schema: { $ref: "#/components/schemas/Issue" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/issues/{issueKey}/children:
    parameters: [{ $ref: "#/components/parameters/IssueKey" }]
    get:
      operationId: issueChildren
      description: An epic's issues or an issue's sub-tasks, with progress (Done-category statuses).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total, done, points, done_points]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Issue" } }
                  total: { type: integer }
                  done: { type: integer }
                  points: { type: number }
                  done_points: { type: number }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/issues/{issueKey}/links:
    parameters: [{ $ref: "#/components/parameters/IssueKey" }]
    get:
      operationId: issueLinks
      description: The issue's links read from its side; links to issues the caller may not read are left out.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: { items: { type: array, items: { $ref: "#/components/schemas/IssueLink" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: linkIssue
      description: "Link this issue to another: <this> blocks / relates to / duplicates / clones <to_key>."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, to_key]
              properties:
                type: { type: string, enum: [blocks, relates, duplicates, clones] }
                to_key: { type: string }
      responses:
        "201": { description: Linked, content: { application/json: { schema: { $ref: "#/components/schemas/IssueLink" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/links/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    delete:
      operationId: unlinkIssue
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/issues/{issueKey}/worklogs:
    parameters: [{ $ref: "#/components/parameters/IssueKey" }]
    get:
      operationId: listWorklogs
      description: Time logged on the issue, oldest first (anyone who can see it). Filled from events, so a new worklog appears within moments.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Worklog" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: logWork
      description: Log time spent (people who may edit the issue). The remaining estimate shrinks by it, never below zero.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spent]
              properties:
                spent: { type: string, description: "Jira-style duration, e.g. 1h 30m" }
                started: { type: string, format: date-time, description: "Default now." }
                comment: { type: string, maxLength: 2000 }
      responses:
        "201": { description: Logged, content: { application/json: { schema: { $ref: "#/components/schemas/Worklog" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/worklogs/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    delete:
      operationId: deleteWorklog
      description: Take a worklog back (its author, or a project admin); its time returns to the remaining estimate.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/issues/{issueKey}/watchers:
    parameters: [{ $ref: "#/components/parameters/IssueKey" }]
    get:
      operationId: issueWatchers
      description: People watching the issue (the reporter, assignees and commenters start watching), and whether the caller is one.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [watching, items]
                properties:
                  watching: { type: boolean }
                  items:
                    type: array
                    items:
                      type: object
                      required: [user_id, name]
                      properties: { user_id: { type: string }, name: { type: string } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: watchIssue
      description: The caller starts watching the issue; watchers hear about its comments and status changes.
      responses:
        "204": { description: Watching }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: unwatchIssue
      description: The caller stops watching the issue.
      responses:
        "204": { description: Not watching }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/issues/{issueKey}/history:
    parameters: [{ $ref: "#/components/parameters/IssueKey" }]
    get:
      operationId: issueHistory
      description: |
        Every action on the issue, oldest first (Jira's History tab): creation, each changed field with its
        old and new value, comments and imports. Actions before v0.14 were recovered from the event log;
        their actor may be unknown (null) and old edits carry no values.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: { items: { type: array, items: { $ref: "#/components/schemas/HistoryEntry" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/issues/{issueKey}/rank:
    parameters: [{ $ref: "#/components/parameters/IssueKey" }]
    post:
      operationId: rankIssue
      description: Move the issue directly after or before another issue of the same project (exactly one of the two).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                after: { type: string, example: KYB-3 }
                before: { type: string, example: KYB-1 }
      responses:
        "200": { description: Re-ranked issue, content: { application/json: { schema: { $ref: "#/components/schemas/Issue" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{key}/sprints:
    parameters: [{ $ref: "#/components/parameters/ProjectKey" }]
    get:
      operationId: listSprints
      description: Active first, then planned (oldest first), then closed (newest first).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: { items: { type: array, items: { $ref: "#/components/schemas/Sprint" } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createSprint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
                goal: { type: string, maxLength: 2000 }
      responses:
        "201": { description: Planned sprint, content: { application/json: { schema: { $ref: "#/components/schemas/Sprint" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/sprints/{id}/start:
    parameters: [{ $ref: "#/components/parameters/SprintID" }]
    post:
      operationId: startSprint
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ends_at: { type: string, format: date-time, description: Defaults to start + 14 days. }
      responses:
        "200": { description: Active sprint, content: { application/json: { schema: { $ref: "#/components/schemas/Sprint" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/sprints/{id}/complete:
    parameters: [{ $ref: "#/components/parameters/SprintID" }]
    post:
      operationId: completeSprint
      description: |
        Closes the active sprint. Issues that are not done are carried over to `move_to` (a planned sprint of the
        same project, 422 otherwise) or, without it, to the backlog; the sprint report lists them as not completed.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: { move_to: { type: string, description: "A planned sprint's id; empty = backlog." } }
      responses:
        "200":
          description: Completion summary
          content:
            application/json:
              schema:
                type: object
                required: [sprint, completed, returned]
                additionalProperties: false
                properties:
                  sprint: { $ref: "#/components/schemas/Sprint" }
                  completed: { type: integer, description: Done issues kept with the closed sprint. }
                  returned: { type: integer, description: Unfinished issues carried over to the backlog or the next sprint. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{key}/import/jira:
    parameters: [{ $ref: "#/components/parameters/ProjectKey" }]
    post:
      operationId: importJira
      description: >-
        Imports a Jira CSV export (project admins only, 10 MB max). `dry_run=true` (default) previews without
        changing anything. A run is idempotent: issues imported earlier are listed in `skipped`. Imported issues
        keep their status and original created/resolved dates in reports, and notify nobody. A run that fails
        midway answers 207 with what it created; running it again resumes.
      parameters:
        - { name: dry_run, in: query, schema: { type: string, enum: ["true", "false"], default: "true" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csv]
              properties: { csv: { type: string, description: CSV text as exported by Jira } }
      responses:
        "200": { description: Preview, content: { application/json: { schema: { $ref: "#/components/schemas/ImportReport" } } } }
        "201": { description: Imported, content: { application/json: { schema: { $ref: "#/components/schemas/ImportReport" } } } }
        "207": { description: Stopped midway; re-run to resume, content: { application/json: { schema: { $ref: "#/components/schemas/ImportReport" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{key}/export.csv:
    parameters: [{ $ref: "#/components/parameters/ProjectKey" }]
    get:
      operationId: exportCsv
      description: >-
        Every issue of the project as a Jira-compatible CSV (UTF-8 with BOM); people are exported by email.
        The file imports back through `importJira`. Cells starting with = + - @ are prefixed with ' to defuse spreadsheet formulas.
      responses:
        "200": { description: CSV file, content: { text/csv: { schema: { type: string } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{key}/reports/summary:
    parameters: [{ $ref: "#/components/parameters/ProjectKey" }]
    get:
      operationId: reportSummary
      description: Current totals and distributions; workload counts open issues; cycle time covers issues done in the last 30 days.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [total, open, done, unassigned, total_points, open_points, by_status, by_type, by_priority, workload, cycle_time]
                properties:
                  total: { type: integer }
                  open: { type: integer }
                  done: { type: integer }
                  unassigned: { type: integer }
                  total_points: { type: number }
                  open_points: { type: number }
                  by_status: { type: array, items: { $ref: "#/components/schemas/Bucket" } }
                  by_type: { type: array, items: { $ref: "#/components/schemas/Bucket" } }
                  by_priority: { type: array, items: { $ref: "#/components/schemas/Bucket" } }
                  workload:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [user_id, name, count, points]
                      properties:
                        user_id: { type: [string, "null"], description: null = unassigned }
                        name: { type: string }
                        count: { type: integer }
                        points: { type: number }
                  cycle_time:
                    type: object
                    additionalProperties: false
                    required: [count, average_hours, median_hours]
                    properties:
                      count: { type: integer }
                      average_hours: { type: number }
                      median_hours: { type: number }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{key}/reports/created-vs-resolved:
    parameters: [{ $ref: "#/components/parameters/ProjectKey" }]
    get:
      operationId: reportCreatedVsResolved
      parameters:
        - { name: days, in: query, schema: { type: string }, description: "1-365, default 30 (UTC days ending today)." }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [days]
                properties:
                  days:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [date, created, resolved, cum_created, cum_resolved]
                      properties:
                        date: { type: string, format: date }
                        created: { type: integer }
                        resolved: { type: integer }
                        cum_created: { type: integer }
                        cum_resolved: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{key}/reports/velocity:
    parameters: [{ $ref: "#/components/parameters/ProjectKey" }]
    get:
      operationId: reportVelocity
      description: The last seven closed sprints, oldest first.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [sprints]
                properties:
                  sprints:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, name, committed_points, completed_points, completed_issues]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        committed_points: { type: number }
                        completed_points: { type: number }
                        completed_issues: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{key}/versions:
