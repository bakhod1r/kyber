apiVersion: v1
kind: Service
metadata:
  name: {{ include "kyber.fullname" . }}
  labels: {{- include "kyber.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "kyber.selector" . | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
    {{- if .Values.mqtt.enabled }}
    - { name: mqtt, port: {{ .Values.mqtt.port }}, targetPort: mqtt }
    {{- end }}
