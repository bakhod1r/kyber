apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kyber.fullname" . }}
  labels: {{- include "kyber.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "kyber.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "kyber.selector" . | nindent 8 }}
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: kyber
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - { name: http, containerPort: 8080 }
            {{- if .Values.mqtt.enabled }}
            - { name: mqtt, containerPort: {{ .Values.mqtt.port }} }
            {{- end }}
          envFrom:
            - secretRef: { name: {{ .Values.existingSecret }} }
          env:
            - { name: KYBER_ADDR, value: ":8080" }
            - { name: KYBER_ATTACHMENTS_DIR, value: /data/attachments }
            {{- if .Values.mqtt.enabled }}
            - { name: KYBER_MQTT_ADDR, value: ":{{ .Values.mqtt.port }}" }
            {{- end }}
            {{- range $k, $v := .Values.env }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: attachments, mountPath: /data/attachments }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: attachments
          {{- if .Values.attachments.persistence.enabled }}
          persistentVolumeClaim: { claimName: {{ include "kyber.fullname" . }}-attachments }
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
