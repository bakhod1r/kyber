services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kyber
      POSTGRES_PASSWORD: kyber
      POSTGRES_DB: kyber
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kyber"]
      interval: 5s
      retries: 10
  kyber:
    build: .
    environment:
      KYBER_DATABASE_URL: postgres://kyber:kyber@postgres:5432/kyber?sslmode=disable
      KYBER_COOKIE_SECURE: "false" # set to true behind HTTPS
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pgdata:
