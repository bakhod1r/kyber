services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres # admin only; Kyber uses the plain "kyber" role (RLS, ADR-0010)
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres-admin}
      POSTGRES_DB: postgres
      KYBER_DB_PASSWORD: ${KYBER_DB_PASSWORD:-kyber}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/compose/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "kyber"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"] # LiveKit and Egress (host networking) reach it on localhost
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  kyber:
    build: .
    environment:
      KYBER_DATABASE_URL: postgres://kyber:${KYBER_DB_PASSWORD:-kyber}@postgres:5432/kyber?sslmode=disable
      KYBER_REDIS_URL: redis://redis:6379/0 # optional: shares the login limiter across replicas
      KYBER_COOKIE_SECURE: "false" # set to true behind HTTPS
      # Huddles (video calls) over the internet: STUN finds public addresses, TURN relays media when a
      # direct connection is impossible. See docs/ops/calls.md. Replace turn.example.com with your host.
      KYBER_ICE_SERVERS: stun:turn.example.com:3478,turn:turn.example.com:3478?transport=udp,turn:turn.example.com:3478?transport=tcp
      KYBER_TURN_SECRET: change-me-to-a-long-random-secret
      # Huddles of more than six people (ADR-0017): with `--profile rooms` (livekit below), uncomment. The key and
      # secret must match LIVEKIT_KEYS; use your host's wss:// address behind TLS.
      # KYBER_LIVEKIT_URL: ws://localhost:7880
      # KYBER_LIVEKIT_KEY: kyber
      # KYBER_LIVEKIT_SECRET: change-me-to-a-long-random-secret-of-32-chars-or-more
      # Server-side recording of those calls (LiveKit Egress below writes into the shared `recordings` volume):
      # KYBER_LIVEKIT_RECORDINGS_DIR: /data/recordings
      # With `--profile dev` (minio + mailpit below), uncomment to store attachments in S3 and send email:
      # KYBER_S3_ENDPOINT: minio:9000
      # KYBER_S3_BUCKET: kyber
      # KYBER_S3_ACCESS_KEY: kyber
      # KYBER_S3_SECRET_KEY: kyber-dev-secret
      # KYBER_S3_TLS: "false"
      # KYBER_SMTP_HOST: mailpit
      # KYBER_SMTP_PORT: "1025"
      # KYBER_SMTP_TLS: none
    ports: ["8080:8080"]
    volumes:
      - attachments:/data/attachments # uploaded files; back up with the database
      - recordings:/data/recordings # LiveKit Egress output (posted to chat, then deleted)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  # TURN/STUN server for huddles (optional on a LAN). host networking: TURN needs a wide UDP port range.
  coturn:
    image: coturn/coturn:4.6
    network_mode: host
    command:
      - --listening-port=3478
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=change-me-to-a-long-random-secret # the same as KYBER_TURN_SECRET
      - --realm=turn.example.com
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-tlsv1
      - --no-tlsv1_1
      - --denied-peer-ip=10.0.0.0-10.255.255.255 # never relay into private networks
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
    profiles: ["calls"] # docker compose --profile calls up
  # Media server for large huddles (ADR-0017, docs/ops/calls.md). host networking: media uses UDP 7882 and TCP 7881.
  livekit:
    image: livekit/livekit-server:v1.9.1
    network_mode: host
    command: ["--bind", "0.0.0.0", "--redis-host", "localhost:6379"] # Redis connects LiveKit and Egress
    environment:
      LIVEKIT_KEYS: "kyber: change-me-to-a-long-random-secret-of-32-chars-or-more" # the same as KYBER_LIVEKIT_*
    profiles: ["rooms"] # docker compose --profile rooms up
  # Records room calls (S104): a headless browser joins the room and writes one MP4 per recording to /out.
  egress:
    image: livekit/egress:v1.9.0
    network_mode: host
    cap_add: ["SYS_ADMIN"] # Chrome's sandbox
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: kyber
        api_secret: change-me-to-a-long-random-secret-of-32-chars-or-more
        ws_url: ws://localhost:7880
        redis: { address: localhost:6379 }
    volumes: ["recordings:/out"]
    profiles: ["rooms"]
  # Development services: S3-compatible storage and a mail catcher (docker compose --profile dev up).
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: kyber
      MINIO_ROOT_PASSWORD: kyber-dev-secret
    ports: ["9000:9000", "9001:9001"] # API, web console
    volumes: ["minio:/data"]
    profiles: ["dev"]
  minio-init: # creates the bucket once MinIO is up
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c", "until mc alias set local http://minio:9000 kyber kyber-dev-secret; do sleep 1; done; mc mb --ignore-existing local/kyber"]
    profiles: ["dev"]
  mailpit:
    image: axllent/mailpit:v1.24
    ports: ["8025:8025"] # web UI; SMTP on mailpit:1025 inside the network
    profiles: ["dev"]
volumes:
  pgdata:
  minio:
  attachments:
  recordings:
