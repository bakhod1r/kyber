name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kyber_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KYBER_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/kyber_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint
      - run: make test
      - run: make cover-strict
      - run: make build
      - name: ctxsentinel (context.Context misuse)
        run: go run github.com/bakhod1r/ctxsentinel/cmd/ctxsentinel@v0.1.0 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci --no-audit --no-fund
      - run: make web-test
      - run: npm --prefix web run build
      - run: npm --prefix web audit --audit-level=high
  e2e:
    runs-on: ubuntu-latest
    needs: [go, web]
    services:
      postgres: # two replicas on one database (replicas.spec.ts)
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kyber_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web
      - run: npx --prefix web playwright install --with-deps chromium
      - run: make e2e
      - name: Two replicas on one database (S58, S105)
        run: make e2e-replicas KYBER_E2E_DATABASE_URL=postgres://postgres:postgres@localhost:5432/kyber_e2e?sslmode=disable
      - name: Media-server e2e (LiveKit, ADR-0017)
        run: |
          curl -fsSL https://github.com/livekit/livekit/releases/download/v1.9.1/livekit_1.9.1_linux_amd64.tar.gz | tar xz -C "$RUNNER_TEMP" livekit-server
          make e2e-rooms LIVEKIT_SERVER="$RUNNER_TEMP/livekit-server"
      - name: Server-side recording e2e (LiveKit Egress, S104)
        run: make e2e-egress LIVEKIT_SERVER="$RUNNER_TEMP/livekit-server"
      - if: failure()
        run: cat e2e.log e2e-rooms.log e2e-egress.log e2e-replica1.log e2e-replica2.log || true
  docker:
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kyber:ci .
