name: pages

# GitHub Pages: the docs site (site/) at /kyber/ and the in-browser demo of the app (web/, VITE_DEMO=1) at /kyber/demo/.

on:
  pull_request:
    paths: ["site/**", "web/**", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["site/**", "web/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: site
      - run: npm run build
        working-directory: site
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Build the demo (the app with its API answered in the browser)
        run: npm run build:demo
        working-directory: web
      - run: cp -r web/dist-demo site/.vitepress/dist/demo
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
